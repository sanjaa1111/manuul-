йна вэ?"]],"x30":[["Сардин загас зардаг дэлгүүр олон байхад яагаад зөвхөн тэр дэлгүүр маш үнэтэй вэ?","Зөвхөн тэд сардин загасны амьд байх хугацааг хэрхэн уртасгахыг мэддэг.","Яриаг үндэслэн юу мэдэж болох вэ?"],["Чи өчигдөр онгоцоор хэдэн цагт ирсэн бэ?","Битгий дурс, 12 цаг дөхөж л ирсэн, 4 цагаар хоцорсон.","Онгоц анх хэдэн цагт ирэх ёстой байсан бэ?"],["Нөгөө талд маш хүчтэй нэг тоглогч байна гэж сонссон, чи итгэлтэй байна уу?","Би түүнийг надад заналхийлж чадна гэж бодохгүй байна.","Эрэгтэй юу гэсэн үг вэ?"],["Та нар энэ жил эрэгтэй багш авахгүй юу?","Бид политехникийн сургууль, эрэгтэй багшийн эзлэх хувь хэтэрхий их.","Эмэгтэй юу гэсэн үг вэ?"],["Чи Сяо Жанг энэ хэргийг сайн хийж чадна гэж бодож байна уу?","Би түүний санаа бодлыг сонссон, үнэхээр ухаалаг гэж бодож байна.","Эрэгтэйн хандлага ямар байна вэ?"],["Тэнд уулархаг газар, нөхцөл тийм муу байхад чи яагаад дэмжлэгийн багшилахаар явахаар бодсон бэ?","Яг л хоцрогдсон газар тул бүгдийн барилгын ажил хэрэгтэй.","Уулархаг газрын талаар аль нь зөв бэ?"],["Би түүнтэй хоёр сар уулзаагүй, утсыг нь ч аваагүй.","Чи ингэж зугтсаар байх арга биш.","Гэхдээ би түүнд яаж хэлэхээ мэдэхгүй байна…","Яаж хэлэхээ мэдэхгүй ч хэлэх хэрэгтэй, хугацаа хэдий чинээ их болох тусам төвөгтэй.","Эрэгтэй юу гэсэн үг вэ?"],["Хятадад нэг жил гаруй болжээ, чи ямар сэтгэгдэлтэй байна вэ?","Миний хамгийн том мэдрэмж бол Хятад хэтэрхий том, сурах, үзэх, идэх зүйл хэтэрхий их, хоёр жил үнэхээр хүрэлцэхгүй.","Тэгвэл чи суралцах хугацаагаа сунгах гэж байна уу?","Би одоо энэ асуудлыг бодож байна.","Эмэгтэйн талаар аль нь зөв бэ?"],["Энэ удаа ажилд ирсэн хүмүүсээс чи хэнд илүү сэтгэл хангалуун байна вэ?","Би тэр Лю ноён сайн гэж бодож байна, бизнесийн хэлэлцээрт маш сайн.","Гэвч тэр урьд нь импорт экспортын худалдаа хийж байсан, бидэнтэй жаахан хол, нас ч жаахан ахимаг.","Мэргэжлийн мэдлэг асуудал биш, сурч болно доо.","Лю ноёны давуу тал юу вэ?"],["Сүүлийн үед хөрөнгийн зах зээл их халуун байна, чи оролдож үзэхгүй юу?","Хөрөнгийн зах зээлийн эрсдэл хэтэрхий том.","Одоо нөхцөл сайн, манай байрны өвөө эмээ нар ч мөнгө олчихсон.","Яг л өвөө эмээ нар хүртэл хувьцаа наймаалж эхэлсэн болохоор л би айж байна.","Эмэгтэй хувьцааны наймаанд ямар хандлагатай вэ?"],["Аав аа, өнөөдөр биологийн хичээл дээр багш бидэнд Дарвины «Байгалийн шалгарлын онол»-ыг заасан.","Тийм үү? Тэгвэл ямар утгатай вэ гэдгийг хэлээд өгөөч.","Энгийнээр хэлбэл, «байгалийн шалгарал» гэдэг нь амьд биетийн дунд өрсөлдөөн оршдог, зохицсон нь л амьд үлдэж, зохицоогүй нь шахагдан гарна.","Маш тодорхой хэлжээ!","Бид хүмүүс ч ингэж өрсөлдөж, олон байгалийн дайсны заналхийллээс зайлсхийж өнөөдрийг хүртэл амьд үлдсэн.","Тийм ээ. Гэхдээ байгалийн шалгарлын хүрээ Дарвины хэлснээс тийм өргөн биш. Дараа нь энэ бүгдийг чи аажим сурна.","«Байгалийн шалгарлын онол»-ыг хэн дэвшүүлсэн бэ?","Энэ яриаг үндэслэн аль нь зөв бэ?"],["Нэг туулай анчинд шархдсан ч буутай шархтайгаа анчин нохойн хөөлтөөс амжилттай мултарч гэртээ буцав. Нөхөд нь бүгд тойрон сандарч асуув: «Тэр нохой маш хатуу, чи бас шархтай, яаж тэднээс салсан юм бэ?» Туулай: «Тэр хурдан гүйдэг ч би бүх хүчээрээ гүйсэн! Тэр намайг гүйцэхгүй бол их хамаагүй загнуулах, харин би бүх хүчээрээ гүйхгүй бол амь насаа алдана!» гэв. Хүн бүрт маш том нууц чадавхи байдаг. Сэтгэл зүйчдийн заасанчлан, ердийн хүний чадавхийн 2%-8% орчим л хөгжсөн. Энэ нь бидэнд 90 гаруй хувийн чадавх нойрмог байдалд байна гэсэн үг. Хэн ч амжилтад хүрэхийг хүсвэл бүх хүчээрээ ажиллах ёстой.","Хэн шархдсан бэ?","Туулай яагаад мултарч чадсан бэ?"]],"x31":[["Ноён Лю гуравт ус өгөх аппарат солихоор ирнэ гэсэн, таны хүссэн марк аль нь вэ гэж асууж байна.","Хамаагүй, хэрэглэхэд сайн бол болно.","Эрэгтэй энэ хэрэгт ямар хандлагатай байна вэ?"],["Үд дунд профессор Линтэй таарсан, тэр чамд хэрэг байна гэсэн.","Анх тохирсон, өглөө түүнд туршилтын тайлан өгөх байсан, гэтэл тэр түр гадагш гарсан тул өгч чадсангүй.","Эмэгтэй яагаад тайлан өгч чадсангүй вэ?"],["Сяо Ли, сурталчилгааны товхимлыг хаана хэвлэсэн бэ? Зарим газар нь бүдэг хэвлэгдсэн байна.","Тэгвэл би нөгөө талтай даруй холбогдож дахин хэвлүүлье.","Эмэгтэй нөгөө талыг яахыг хүсч байна вэ?"],["Эргэлзэх хэрэггүй, байрны эзэн түрээсийг сунгахыг зөвшөөрсөн, чамд өөр тохиромжтой байр байхгүй бол дахин хагас жил амьдар.","Тийм ээ, түрээс нэмэгдсэн ч хүлээж болохоор, дахиж нүүхээс ч сэргийлнэ.","Байр түрээсийн талаар эрэгтэй ямар бодолтой байна вэ?"],["Өчигдөр орой чиний утас үргэлж завгүй байсан, хэн рүү залгаж байсан бэ?","Миний найз Сяо Мэй, хоёр нөхөр нь салах гэж маргалдаж байгаа тул би утсаар түүнд тайвширахыг ятгаж байлаа.","Сяо Мэй яасан бэ?"],["Чиний боловсруулсан төлөвлөгөө хурал дээр батлагдсан уу?","Би төлөвлөгөөгөө тэдэнд хэлэхэд ганц ч хүн дэмжсэнгүй.","Бүгд энэ төлөвлөгөөг яаж үзсэн бэ?"],["Сяо Ли залгасан юм уу? Яагаад ийм удаан ярив?","Таны дүү, дахиад хайр сэтгэлд бүтэлгүйтсэн. Ах нь болоод чи ч хамаагүй байна.","Би яаж хамаарах юм бэ? Чи түүний эгч шүү дээ, миний оронд түүнийг жаахан тайвшруулаарай.","Чамайг ингэж хэлнэ гэдгийг л мэдсэн.","Ярьж буй хоёр ямар харилцаатай вэ?"],["Өмнө нь очсон тэр компани үр дүн гарсан уу?","Хэд хэдэн удаа холбогдсон, тэдний менежер Лю надад бүр хүйтэн ханддаг.","Эхэндээ бүгд ингэдэг, зөвхөн материал харж мэдэх нь хангалтгүй.","Тийм, би дахин очиж түүнд танилцуулга хийхийг хичээнэ.","Эрэгтэй дараа нь юу хийхийг хүсч байна вэ?"],["Намайг гэрт хүргэж өгсөнд баярлалаа, чи энд тийм ч танил биш биз?","Ийм ойрхон замыг би яагаад ийм удаан явсан гэж гайхаж байна уу?","Тийм ээ, чи зам мэдэхгүй юм шиг.","Хэрэв би энд мэддэггүй бол нэг цаг гаруй жолоодож гэрийн чинь хаалганы дэргэдүүр нэг ч удаа өнгөрөөгүй байх вий?","Яриаг үндэслэн юу мэдэж болох вэ?"],["Чи ч бас Лю Жинг мэддэг үү?","Тийм, бид ахлах ангийн ангийнхан, тэр урлагийнх, би байгалийн ангид.","Тэр бойжилтоор онцгой сайн.","Тийм, сургуульд байхдаа бойжилтын багт байсан, тайцзи бүхий тэмцээний аварга ч болсон.","Лю Жингийн талаар юу мэдэж болох вэ?"],["Хатагтай, таны тасалбар?","Тасалбар? Надад байхгүй.","Байхгүй юу? Тэгвэл та хаашаа явах вэ?","Би хаашаа ч явахгүй.","Тэгвэл яагаад энэ галт тэргэнд сууж байна вэ?","Би буудал дээр энэ галт тэргийг тааралдаж, галт тэргэн дээрх радиогоор «Бүгд хурдан суугаарай!» гэж чангаар хашгирахыг сонсоод, хаалгаар орохоос өөр аргагүй болсон.","Тэр ноёны талаар юу мэдэж болох вэ?","Ярьж байхад тэд хаана байгаа байх магадлалтай вэ?"],["Би түүнд хоёр жил нууцаар дурласан ч нээж хэлэх зориг хэзээ ч байсангүй. Найзуудынхаа урамшуулалаар би эцэст нь хайр дүүрэн цаасан тэмдэглэл бичсэн. Гэвч түүнтэй хэд хэдэн удаа тааралдахад тэр тэмдэглэлийг чанга атгасан гар халааснаасаа гарахгүй байлаа. Ингэж хэдэн боломж алдаж, тэмдэглэл нугалаастай болсон. Эцэст нь нэг өдөр хаанаас зориг гарсныг мэдэхгүй, түүнийг хармагц тэр нугалаастай цаасыг гарт нь шахаад яаран зугтав. Маргааш нь тэр залгаж уулзахыг хүсэв. Би хоёр талаараа сэтгэл хөдөлж, түгшин, бүдэг гэрэлтэй гудамжны дэнлүүний доор уулзав. Тэр түгшин байгаа намайг хараад яаран асуув: «Өчигдөр чи надад зуун юань шахсан нь юуных вэ?»","Энэ хэсэгт байгаа «би»-ийн талаар аль нь зөв бэ?","Энэ хэсгээс юу мэдэж болох вэ?"]],"x32":[["Чи надад энэ программыг яаж хэрэглэхийг зааж өгч чадах уу?","Энэ чиний бодсон шиг хэцүү биш, надад нэг ном байна, харахад л ойлгоно.","Эмэгтэй юу гэсэн үг вэ?"],["Маргааш багшид шинэ жилийн мэнд хүргэхэд машинаар явах уу?","Багшийн гэр метроны буудалд маш ойрхон, бид ч ногоон аялалд бага зэрэг хувь нэмэр оруулъя.","Эрэгтэй багшийнд яаж очихыг хүсч байна вэ?"],["Маргааш сургууль хавар аялал зохион байгуулна, бид хуванцар уут авчирна.","Тийм ээ, идсэнээс үлдсэн хог хаягдлыг бүгдийг уутанд хийж, дураараа бүү хая.","Эрэгтэйн талаар аль нь зөв бэ?"],["Лили надтай эвлэрнэ гэж чи бодож байна уу?","Би чамд хэлье, энэ бодлоос хол бай, дахиад хий хоосон мөрөөдлөөр бүү зов.","Лилигийн талаар эмэгтэй эрэгтэйд юу хийхийг зөвлөж байна вэ?"],["Сүүлийн хэдэн өдөр агаарын чанар муу, манан утаа их өндөр байна.","Гэрийн өвгөд агаарын бохирдолд мэдрэмтгий, сүүлийн үед бага гадуур явсан нь дээр.","Эрэгтэй өвгөдөд юу зөвлөж байна вэ?"],["Өвгөн Лигийн мэс заслыг аль болох өглөө хийхээр товлоорой.","Би ч бас ингэж бодож байсан, өглөө эрч хүчтэй тул маргаашийн эхний мэс засал болгоё.","Ноён Лигийн талаар юу мэдэж болох вэ?"],["Би Лю Фангтай мэндэлсэн, тэр чамайг дагуулна.","Удирдлагын халамжид баярлалаа, ойлгомжгүй газраа заавал асууна.","Энэ нь компанийн дөрөв дэх улирлын борлуулалтын тайлан, аваад харж үзээрэй.","За, би сайн суралцаж, эхлээд бизнесийг танилцана.","Эмэгтэйн талаар аль нь зөв бэ?"],["Давтан шатны үр дүнг хэзээ зарлах вэ?","Дараа сарын 5-нд хүртэл тэмцээний албан ёсны вэбсайтаас лавлах боломжтой гэсэн.","Эрт байна, энэ хэдэн өдөр амарч болно.","Тийм, тэвчээртэй хүлээе.","Давтан шатны үр дүнг ямар хэлбэрээр зарлах вэ?"],["Чи өнөөдөр яагаад ийм эрч хүчгүй байна вэ, өчигдөр нойргүйдсэн үү?","Битгий хэлээч, ирэх сарын захиалгын тал нь хараахан дуусаагүй, санаа зовоод үхэх нь.","Одоо бизнес хийхэд бүгд хэцүү, чи ч бас бага зэрэг тайван бай.","Үдээс хойш нэг үйлчлүүлэгчтэй уулзана, болох эсэх нь түүнээс шалтгаална.","Эмэгтэйн одоогийн сэтгэл ямар байна вэ?"],["Маргааш 10-ны өдөр, чухал эдийн засгийн өгөгдөл зарлагдах гэж байна.","Эдийн засгийн дарамт хэвээр том санагдаж байна.","Миний одоо хамгийн их санаа зовж байгаа нь маргааш миний хувьцаа яах бол.","Би магадгүй өсөх байх гэж бодож байна, байрны үнэ сүүлийн үед өссөн биз дээ.","Яриаг үндэслэвэл эмэгтэй одоо юунд санаа зовж байна вэ?"],["Энэ агаарын бохирдуулагч бодис хаанаас ирдэг гэж чи бодож байна?","Ихэнх нь хотын эргэн тойрны үйлдвэрүүдийн ялгаруулсан утаа, мөн машины яндангийн утаа ч бас том бохирдлын эх үүсвэр.","Би өдөр бүр цаг агаарын мэдээнд гарсан PM2.5-ын өгөгдлийг анхааран хардаг.","Одоо засах хүчин чармайлт тасралтгүй нэмэгдэж, энэ жил зарим сайжрал гарсан.","Хэдийн сайжирсан ч сэтгэл хангалуун болоход хол байна. Манайд хоёр агаар цэвэрлэгч аль хэдийн авсан.","Өвгөд, хүүхдүүд мэдрэмтгий бүлэг, онцгой хамгаалалтад анхаарч, гадуур гарахдаа амны хаалт зүүх нь дээр.","Хотын одоогийн агаарын бохирдлын талаар эмэгтэй ямар үзэлтэй вэ?","Агаарын бохирдолтой нүүр тулахад эрэгтэй юу хийхийг хэлсэн бэ?"],["Судалгаагаар дунджаар гэр бүл бүр өдөрт хөргөгчийн хаалгыг 22 удаа нээдэг. Гэрт сониуч хүүхэд байвал илүү олон болно. Нэг удаа нээх бүрт хөргөгчийн хүйтэн агаар гарч, гаднах халуун агаар орж, хөргөгч дахин хөргөхөд илүү цахилгаан зарцуулна. Тиймээс хөргөгчийн хаалгыг нээсний дараа юу авахаа бодохоос зайлсхий. Эхлээд бод, дараа нь нээ. Юмаа авсны дараа хаалгаа даруй хааж, хөргөгчийн хүйтэн агаар гарах, гаднах халуун агаар орохыг багасга. Түүнээс гадна эцэг эхдээ хөргөгчийн температурын тохиргоо тохиромжтой эсэхийг баталгаажуулж, хөргөгчийн ууршуулагчийг цэвэр байлгавал ажлын үр ашиг нэмэгдэнэ гэдгийг хэлэхээ бүү март.","Гэрийн хөргөгчийн талаар энэ хэсэгт ямар нөхцөл дурдагдсан бэ?","Энэ хэсэг хөргөгчийн цахилгаан хэмнэх ямар аргыг санал болгосон бэ?"]],"x33":[["Бид жаахан хурдлах хэрэгтэй, үгүй бол 2-р шугамын сүүлчийн галт тэргээ гүйцэхгүй.","Санаа зовох хэрэггүй, урд талын уулзвараар эргэхэд метроны орц болно.","Эмэгтэй яагаад яарч байна вэ?"],["Тэд хамтран ажиллахдаа хараахан чадварлаг биш, дууны үг ч сайн цээжлээгүй гэж би бодож байна.","Тэдний энэ баг өнгөрсөн сард л байгуулагдсан, хугацаа богино.","Эрэгтэй тэдний талаар ямар үзэлтэй вэ?"],["Ноён, уучлаарай! Онгоц удахгүй газардах гэж байна, одоо жорлон түр хаалттай.","За, баярлалаа.","Эмэгтэй эрэгтэйд юуг сануулав?"],["Жолооч аа, би зам андуурсан бололтой, дөнгөж сая тэр уулзвар дээр зүүн тийш эргэх ёстой байсан.","За, би дараагийн уулзвар дээр эргэж буцъя.","Эрэгтэй дараа нь юу хийхээр төлөвлөж байна вэ?"],["Сайн байна уу, Наньханы онгоцны бүртгэлийг хаана хийдэг вэ?","Та өнгөрчихөж, Наньханы үйлчилгээний тавиур H бүсэд байна, буцаж яваарай.","Ярьж буй хүмүүс одоо хаана байх магадлалтай вэ?"],["Муу байна, тээшний түлхүүр яагаад алга болчихов? Халаасандаа хийсэн санагдаж байсан юм.","Санаа зовох хэрэггүй, сайн санаж үз. Чи ихэвчлэн тээврийн жижиг үүрдэг үүргэвчиндээ хийдэг биш үү?","Эмэгтэй яасан бэ?"],["Та зурагт зардаг худалдагчаас зөвлөгөө авсан уу?","Асуусан, гэхдээ одоогийн шинэ технологи, шинэ нэр томьёог би бас сайн ойлгохгүй байна.","Тэгвэл яах бодолтой байна?","Миний бодлоор функц нь хэдий чинээ энгийн, төдий чинээ сайн, моод хөөх шаардлагагүй.","Зурагт худалдан авах талаар эрэгтэй яах бодолтой байна вэ?"],["Чи метроор Фэнлян талбай хүртэл явж, уулзварын баруун хойд буланд Лантян бизнесийн өндөр барилга байна.","Дараа нь?","Чи явган хүний газар доорх гарцаар ирээд, барилгын доод давхарт кофены газар бий, би тэнд чамайг хүлээнэ.","За, би удахгүй очно.","Эмэгтэй дараа нь юу хийх ёстой вэ?"],["Сүүлийн хоёр өдөр яагаад машингүй байна вэ?","Өмнө нь замд хүнтэй мөргөлдөж, ноцтой биш, нөгөө тал бүх хариуцлагыг хүлээсэн.","Даатгалын компанийн нөхөн олговрын журмыг бүрдүүлсэн үү?","Шийдэгдсэн, машин ч бараг л засагдаж дууслаа.","Эрэгтэйн талаар юу мэдэж болох вэ?"],["Лю багш аа, дараа долоо хоногийн оройн соёлын сонгон хичээл өөрчлөгдөх үү?","Яагаад гэнэт надаас энэ тухай асуух болов?","Дараа долоо хоногт дундын шалгалт болох гэж байгаа биз дээ, оройн хичээл хийх үү?","Энэ нь ямар ч нөлөөгүй, соёлын хичээл ердийнхөөрөө.","Соёлын хичээлийн талаар юу мэдэж болох вэ?"],["Эмээ, тасалбар шалгана, тасалбараа үзүүлээрэй.","Галт тэрэгний ажилтан аа, Шиань хүртэл хэдэн цаг явдаг вэ?","Эмээ, манай энэ галт тэрэг Шэньянаас Шанхай явдаг, Шианьд очдоггүй.","Үгүй, миний тасалбар Бээжин-Шиань байна.","Таны тасалбар Шиань хүртэл нь үнэн, гэвч та буруу галт тэргэнд суусан.","Яах вэ, галт тэрэгний жолооч ч өөрийн чиглэл буруу гэдгийг ойлгоогүй юм уу?","Яриаг үндэслэн энэ галт тэрэг хаашаа явдаг вэ?","Тэр эмээгийн талаар юу мэдэж болох вэ?"],["Гадаадын нэгэн аялал жуулчлалын компанийн судалгаагаар Европ руу явсан хятад жуулчдын 46% нь Европын хоолыг ердөө нэг л удаа амсаж үзсэн, 10% нь нэг ч удаа идэж үзээгүй. Тэр цорын ганц Европын хоол ч аяллын агентлагаас өгсөн, жишээ нь Парист далайн хоол, Германд хиам, Италид италийн гоймон, бусад хоол нь «Хятад маягийн», олон хүн зочид буудлын өрөөнд өөрийн авчирсан шуудхан гоймонг идэхийг сонгосон. Гэвч тэд шинжилгээгээр энэ нь хятад хүн Европын хоол иддэггүй гэсэн үг биш, зүгээр л дасаагүй, бас ядарсан аяллын үед тэр л биш гэж үзсэн. Нөгөө талаас Европын хоолны соёлыг ойлгох нь хятад жуулчдын төлөвлөсөн аяллын зорилт биш, тэднийг сэтгэл хөдөлгөх нь биш, тэд алдартай үзмэрүүдийг үзэхэд илүү анхаардаг.","Европ руу аялсан хятад жуулчдын талаар судалгааны өгөгдлөөс юу мэдэж болох вэ?","Энэ хэсгээс хятад жуулчид Европт хамгийн их юу хийхийг сонирхдог вэ?"]],"x34":[["Шувууны хамгийн чухал онцлог юу вэ? Жигүүртэй, нисдэг нь үү? Эсвэл шавьж иддэг нь үү?","Шувууг бусад амьтнаас ялгах цорын ганц онцлог бол өдтэй байх.","Шувууны хамгийн чухал онцлог юу вэ?"],["Ээж ээ, би өнөө орой дахиад илүү цагаар ажиллана, 11 цагаас хойш л гэртээ ирнэ.","Аяа, ингээд яаж болох юм бэ… чи биеэ хайрла!","Эмэгтэй ямар өнгө аястай вэ?"],["Залуу хүн гэртээ хаалттай, нийгэмтэй харьцдаггүй яаж болох юм бэ?","Би зүгээр л гадуур ажиллахыг хүсдэггүй, гэр бүлд мөнгө дутдаггүй шүү дээ?","Эрэгтэйн талаар аль нь зөв бэ?"],["Би түүнийг сайн гэж бодож байна, чи яагаад түүнд дургүй байна вэ?","Том эр хүн өдөр бүр сам биедээ үүрч, толь таарахад самнаж байхыг би хараад чадахгүй байна.","Эмэгтэй яагаад тэр хүнд дургүй вэ?"],["Телевиз, кинонд акулыг «далайн алуурчин» гэж байнга ярьдаг, үнэн үү?","Тийм аймшигтай биш, дэлхий дээр 370 гаруй төрлийн акул бий, ихэнх нь хүнд хор хөнөөлгүй, цөөн төрөл л хүнд хор учруулдаг.","Акулын талаар аль нь зөв бэ?"],["Энэ аяга үнэхээр сайн, чулуун уу, эсвэл төмөр үү?","Чи андуурчээ, энэ модон аяга.","Энэ аяга ямар материалаар хийгдсэн бэ?"],["Аав аа, шувуу унтдаггүй юм уу?","Унтдаг шүү! Ихэнх шувуу өдөрт ойролцоогоор 8 цаг унтдаг, зарим шувуу бараг 20 цаг унтдаг, мөн зарим нь бараг огт унтдаггүй.","Тэгвэл бид яагаад унтаж буй шувууг цөөхөн харддаг вэ?","Учир нь тэд ихэвчлэн нууц газар амардаг.","Шувууны нойрны талаар аль нь зөв бэ?"],["Өнөөдөр сурсан шувууны элсэн усанд орох нь шувууд элсээр угаалга хийх, их сонирхолтой.","Үнэхээр төсөөлөхөд хэцүү, элсээр яаж угаах вэ?","Учир нь тэд цөл мэт хуурай орчинд амьдардаг.","Би бас цөлийн зарим газар хүмүүс элсний эмчилгээгээр бие тэнхээгээ сайжруулж өвчнийг эмчилдэг гэж сонссон.","Элсний эмчилгээний үүрэг юу вэ?"],["Халим урьд нь хуурай газар дээр амьдарч байсан гэдэгт чи итгэх үү?","Яаж тийм байх вэ? Тэр далайн хамгийн том амьтдын нэг биш билүү?","Эрдэмтэд нэгэн цагт өндөр уулнаас таван зуун мянган жилийн өмнөх эртний халимны яс олсон. Судалгаагаар халим урьд нь далайн эрэгт амьдарч байсан, хожим хуурай газрын хоол улам цөөрч, далайд загас элбэг тул тэд аажим хуурай газраас холдсон.","Халим яагаад хуурай газраас гарсан бэ?"],["Та нарын дотуур байранд шинээр ирсэн Сяо Ван хэргийг маш тааламжгүй хийдэг!","Яасан?","Өчигдөр тэр супермаркет явна гэхээр би түүнээс саван авчирахыг хүссэн, тэр удаан асуусан, хэчнээн юанийнх, хувцас угаах уу, биеийн угаах уу, ямар өнгөтэй гээд… энэ цагт би өөрөө аваад ирчихсэн байх байсан.","Тэр хүний хандлага нухацтай шүү дээ.","Сяо Ванг эрэгтэй яаж үзэж байна вэ?"],["Нэг хулгана арслангийн өмнө дуудаж, түүнтэй тулалдахыг хүсэв, арслан татгалзав. Хулгана асуув: «Чи айсан уу?» «Маш их айсан, гэхдээ би чамаас айгаагүй.» арслан хэлэв, «Би зөвшөөрвөл чи арсланд тулсан гэсэн нэр хүнд авна. Харин би бүх амьтдад «Хулгана тулалдсан нь арслан» гэж шоолуулна.» Эргэлзээгүй, энэ арслан маш ухаантай. Учир нь хулганатай тэмцэхийн төвөг: хожсон ч өрсөлдөгч нь зөвхөн хулгана. Ихэвчлэн агуу хүмүүс бага түвшний хүнтэй өрсөлдөх сонирхолгүй, харин өөртэй ижил, бүр өөрөөс нь илүү өрсөлдөгчтэй нүүр тулахыг хүсдэг.","Арслан яагаад хулганаас татгалзсан бэ?","Зохиогч арслангийн үйлдэлд ямар хандлагатай байна вэ?"],["Удаан ажиглалт, судалгааны үр дүнд амьтан судлаачид амьтдын нойрны олон янз байдлыг бидэнд харуулсан: Туулай хулчгар, өдөрт гуравхан удаа нойрмоглож, удаа бүр хэдхэн секунд, өдөрт ойролцоогоор хоёр минутын нойртой. Үхэр зогсоо дахин идээ шагайх бөгөөд өдөрт хамгийн ихдээ хагас цаг унтана. Заан зогсоод унтдаг, жижиг хорхой, хулгана хамарт орохоос сэргийлж унтахдаа урт хошууг нугалж ам руу ороож зөөлхөн барьдаг. Арслан цадахаар идэж, уувал 16 цаг дараалан унтаж чадна.","Хамгийн богино унтдаг амьтан аль нь вэ?","Заан унтахдаа яагаад хошууг нугалдаг вэ?"]],"x35":[["Цаг агаар хэтэрхий халуун, арван минут тоглоод л тэсэхээ байлаа, тэр модны доор амрана.","Ус дулаан юм уугаарай, зайрмаг зэрэг юм бүү ид.","Эмэгтэй ямар зөвлөгөө өгч байна вэ?"],["Хятадын мод тарих баяр хэдний өдөр вэ?","3-р сарын 12, Сунь Ятсен таалал төгссөн өдөр, тэр мод тарьж ой бий болгохыг үргэлж дэмжиж байсан.","Хятадын мод тарих баяр яагаад 3-р сарын 12 бэ?"],["Чи өчигдөр Сяо Ланыг эргэж очсон уу? Тэр хэр сэргэв?","Нэлээн сайн, дахин хоёр хоногийн дараа эмнэлгээс гарна.","Яриаг үндэслэн юу мэдэж болох вэ?"],["Оффисын шинэ хувилагч үнэхээр сайн!","Тийм, автоматаар цаас солино, автоматаар хуудас эргүүлнэ, бүр автоматаар хавсаргана!","Тэд юуны тухай ярьж байна вэ?"],["Маргаашийн арга хэмжээ маш чухал, та нар бүгд дэггүйтэж болохгүй шүү!","Багш аа, бүх үйлдэл тушаалаар явна гэж амлая!","Эрэгтэй юу гэсэн үг вэ?"],["Хүүхэд бага байна, чи сэтгэл хөдлөлөө жаахан хяна, түүнийг бүү айлга.","Тэр ингэхийг харах бүрт би уурандаа тэсэхгүй.","Эмэгтэй яасан бэ?"],["Мод капилляр үзэгдлээр ус дээш гаргадаг юм уу?","Урьд нь бүгд тийм гэж үзэж байсан, одоо хүмүүс уурших таталцлын хүч үйлчилдэг гэдгийг олсон.","Тэгвэл тодорхой яаж ажилладаг вэ?","Энэ нь одоог хүртэл нууц хэвээр.","Уурших таталцлын талаар аль нь зөв бэ?"],["Чи Сяо Люгийн хамт дурласан уу?","Ёоё! Би түүнийг огт мэдэхгүй.","Чи нууж бүү яв, би аль Сяо Лю гэдгийг ч хэлээгүй, чи мэдэхгүй гэв.","Ямар ч Сяо Лю байсан миний найз залуу биш.","Эмэгтэй юу гэсэн үг вэ?"],["Чи энэ удаагийн шалгалтад яаж өгсөн бэ?","Сайн биш. Олон бодлого хичээлийн дараах нэмэлт шинэ үгтэй холбоотой гэж харагдсан, гэвч би нэмэлт шинэ үг шалгалтад орохгүй гэж бодоод огт давтаагүй.","Багш үүнийг анхааруулж онцолсон шүү дээ!","Үнэндээ би сонссон ч давтах цаг хүрэлцээгүй, хайхраагүй.","Эрэгтэй яагаад шалгалтад сайн өгөөгүй вэ?"],["Одоогоор хүний урсгал маш их, бүгдээрээ журмаа сахиж, тасалбараа бэлдэж, дараалж, галт тэргэнд орох үеийн шалгалтад ороорой.","Сайн байна уу, би интернэтээр захиалсан, тасалбар байхгүй, иргэний үнэмлэхээр орж болох уу?","Болно. Хэрэв танд тасалбар хэрэгтэй бол тэнд автомат тасалбар авах машинаас авч болно.","За, баярлалаа.","Эрэгтэй хэн байх магадлалтай вэ?"],["Кактус бол амьдрах хүч маш хүчтэй ургамал, хуурай цөлийн бүсэд ургаж, усны хомсдолд зохицохын тулд навч нь богино жижиг өргөс болж, уурших усыг багасгахаас гадна амьтан идэхээс хамгаалах зэвсэг болдог. Тэдний үндэс маш хөгжсөн, бороо ороход их хэмжээний ус шингээж, ингэж өөрийн ургах хэрэгцээг хангана.","Кактус аль орчинд хамгийн сайн зохицдог вэ?","Кактусын үндэс ямар онцлогтой вэ?"],["Чи ичимхий өвсийг харсан уу? Энэ маш сонин: нэр нь өвс ч цэцэглэдэг, ургамал гэхээр амьтан шиг «ичдэг». Үнэндээ энэ нь гэрэл, дулаанд маш мэдрэмтгий, бид гараараа хөнгөхөн хүрэхэд л задарсан навч нь доош хаагдаж, хэдэн минутын дараа л дахин дэлгэгддэг. Ичимхий өвс халуун бүсийн Америкаас гаралтай, одоо дэлхийн халуун ба хагас халуун бүсэд өргөн тархсан. Цэцэг, навч нь үзэмжтэй, амархан ургадаг, тагтны савны ургамалд тохиромжтой. Мөн цус зогсоох, өвдөлт намдаахад эм болгон хэрэглэдэг.","Хүмүүс яагаад энэ ургамлыг «ичимхий өвс» гэдэг вэ?","Ичимхий өвсний талаар аль нь зөв бэ?"]],"x36":[["Та бичих явцдаа амардаг уу?","Тийм, би ихэнхдээ жаахан бичээд хашаандаа алхаж, цэцгээ тайрч, хэдэн гоё жижиг чулуу түүдэг. Ингэж оюун ухаан, бие бялдар сайн нийлж, бие сэтгэл тайвширдаг.","Эрэгтэй яагаад цэцгийн мөчрийг тайрдаг вэ?"],["Таны цэцэг ийм сайхан ургасан байна, туршлагаа дүгнэсэн үү?","Зарим цэцэг хуурайг дуртай бол ус бүү их цац, зарим цэцэг чийглэг орчинд дуртай бол нарны дор бүү тавь.","Эмэгтэй цэцэг ургуулахад хамгийн чухал нь юу гэж үзэж байна вэ?"],["Чи яагаад ийм ядарсан харагдаж байна?","Ажил тарахын өмнөхөн өвчтөн ирж, яаралтай байдал, хоёр цагийн мэс засал хийж, бэлхүүс маань тэнийхээ байлаа.","Эрэгтэй яасан бэ?"],["Энэ удаа үнэхээр бүтэлгүйтлээ!","Амьдрал үргэлж амжилт, бүтэлгүйтэлтэй, уйтгар, аз жаргалтай, ингэж сэтгэл бүү гутар.","Эмэгтэй ямар өнгө аястай вэ?"],["Маргаашийн тэмцээнд чи бэлэн үү?","Чадварлаг ажил, өдөр бүр хийдэг, нүд аньж ч даван туулна, санаа зов!","Эрэгтэй юу гэсэн үг вэ?"],["Чи гудамж цэвэрлэж мөнгө олж, ичгүүртэй санагдаж байна уу?","Би хулгай, дээрмийн ажил хийдэггүй, өөрийн хөдөлмөрөөр амьдардаг, ичих юм байна уу?","Эмэгтэйн мөнгө хаанаас ирдэг вэ?"],["Лао Шэ маш их цэцэгт дуртай гэсэн үү?","Тийм, түүний тарьсан цэцэг маш их, нэг хашаа дүүрэн.","Тэр ямар цэцэгт дуртай вэ?","Амархан ургадаг, өөрөө тэмцэж чаддаг. Тэр Бээжингийн цаг уур цэцэг ургуулахад тохиромжгүй, өмнөд хэсгийн алдартай цэцгийг ургуулах амаргүй гэж хэлсэн.","Лао Шэ ямар цэцэгт дуртай вэ?"],["Бээжинд Лао Шэ цайны газар бий, Лао Шэ ноёны нээсэн дэлгүүр мөн үү?","Үгүй, түүний нэрээр нэрлэсэн.","Чи очиж үзсэн үү? Ямар вэ?","Маш сайн, хямд том аягатай цай, Бээжингийн уламжлалт зууш, мөн Бээжингийн дуурь, хошин ярианы тоглолт бий.","Лао Шэ цайны газрын талаар аль нь зөв бэ?"],["Яасан, дахиад хайртайгаа маргалдсан уу?","Маргаагүй, тэр дураараа уурлаж, би хайхрахыг хүсэхгүй өөрөө гарч ирлээ.","Энэ нь болохгүй, чи цаашид буцахгүй бол хэрэг биш, үгүй бол эртхэн гэртээ харих нь дээр.","Эхлээд тус тусдаа тайвширъя.","Эрэгтэй юу гэсэн үг вэ?"],["Энэ нь миний өчигдөр худалдаж авсан хувцас, жаахан асуудалтай, буцааж өгөөч.","Таны энэ хувцсыг хэдийн задалсан, бид буцааж авч чадахгүй.","Энэ хувцас чанарын асуудалтай, заавал буцаах ёстой.","Тэгвэл та бас үнийн шошгыг бүү хайчил!","Эмэгтэй яагаад буцаалт хийхгүй байна вэ?"],["Хүн бүр амттай шинэхэн ногоо, жимс идэхийг хүсдэг. Гэвч хотод амьдардаг хүмүүс зөвхөн супермаркет, зах дээр зарагддаг ногоо, жимсийг л авч чадна. Эдгээр нь шинэ байдал, төрөл зүйлийн хувьд хүмүүсийн хэрэгцээг бүрэн хангахгүй, үнэ ч үнэтэй, ялангуяа өвөл. Зардал хэмнэж, дуртай ногоогоо идэхийн тулд Англид олон оршин суугч цонхны тавиур дээр тэжээллэг хөрсөөр өөрөө ногоо тарьж эхэлсэн. Сайн зохион байгуулбал дуртай ногоо, жимсээ идэхээс гадна гэртээ үзэж таашаах ургамал нэмэгдэнэ.","Энэ хэсгээс олон англичууд хаана ногоо тарьдаг вэ?","Зарим хүн яагаад супермаркетаас ногоо жимс авахыг хүсэхгүй байна вэ?"],["Мэдээнд дурдсанаар, 19 настай Бээжингийн охин 10 жилийн дотор бараг 40 ширхэг Тамагочи эзэмшиж, энэ жижиг тоглоомын машинд нийт арван мянган юань гаргасан. Та «Тамагочи» гэдэг нэрийг мэдэхгүй байж болох ч «электрон гэрийн тэжээвэр амьтан»-ыг заавал санаж байгаа. Электрон гэрийн тэжээвэр амьтан гэдэг үг одоо жаахан хуучирсан сонсогдож болох ч энэ нь олон хүн, ялангуяа 90-ээд оны хойш төрөгсдийн хүүхэд насны дурсамж. Одоо ч энэ жижиг электрон тэжээвэр амьтны тоглоомын машин олон үнэнч сонирхогчдыг татсаар байна.","Энэ хэсэг гол төлөв юуны тухай ярьж байна вэ?","Электрон гэрийн тэжээвэр амьтны талаар аль нь зөв бэ?"]],"x0":[["Энэ загварт та нар эцэст нь итгэлтэй байна уу?","Санаа зовох хэрэггүй, бид зургийг хэд хэдэн удаа шалгасан.","Эрэгтэй юу гэсэн үг вэ?"],["Сайн байна уу! Би өнөөдрийн 5-р танхимын үзэсгэлэнг үзэх гэсэн, интернэтээр аль хэдийн захиалсан.","Жаахан хүлээнэ үү. Энэ таны тасалбар, сайн авна уу.","Тэд хаана байх магадлалтай вэ?"],["Чи хаана тавгүй байна?","Хүзүүнээс нуруу хүртэл хүчтэй өвдөж байна.","Эрэгтэйн аль хэсэг нь асуудалгүй вэ?"],["Шинэ ирсэн Сяо Ванг чи яаж үзэж байна?","Яриа багатай, ажлаа хийхдээ ч маш болгоомжтой.","Сяо Ван ямар хүн бэ?"],["Та нарын энэ удаа урьсан Лю дасгалжуулагч үнэхээр сайн! Хүүхдүүд бүгд түүнд дуртай.","Тэр өмнө нь хотын аварга ч болж байсан! Би түүний фен шүү дээ.","Яриаг үндэслэн юу мэдэж болох вэ?"],["Энэ жүжиг сайн уу?","Дүрүүд нь маш амьд, хэлний хэв маяг ч өвөрмөц.","Энэ жүжгийн тухайд эмэгтэй ямар хандлагатай вэ?"],["Уучлаарай, танайд картаар төлж болох уу? Надад бэлэн мөнгө хүрэлцэхгүй.","Болно, мөн утсаар төлж болно.","Эмэгтэй юу хийх гэж байна вэ?"],["Эдгээр түүхий эд хийсэн хайрцгууд коридорт овоологдож, явахад саад болж байна, яагаад зохицуулахгүй байна вэ?","За, ноён Жао, би яг одоо хүн дуудъя.","Эрэгтэй эмэгтэйг юу хийлгэх гэж байна вэ?"],["Би дараа долоо хоногт томилолтоор явна, та миний нохойг харж өгч чадах уу?","Уучлаарай, миний охин амьтанд харшилтай.","Эрэгтэй юу гэсэн үг вэ?"],["Хөтөч хэлээгүй бол эдгээр барилга хэдэн зуун жилийн түүхтэй гэдэг үнэхээр танигдахгүй байна.","Ийм том цар хүрээтэй, ийм сайн хадгалагдсан нь гайхалтай!","Эдгээр барилгын талаар юу мэдэж болох вэ?"],["Номын шүүгээний шургуулгыг хараач, яагаад хаагдахгүй байгааг мэдэхгүй байна.","Дотор нь ямар нэг юм гацчихсан бололтой.","Юу асуудалтай вэ?"],["Сайн байна уу, энэ Хятад хэлний тэнхим уу? Би бүртгэлийн журам бүрдүүлэхээр ирсэн.","Тавтай морил, шинэ оюутан аа! Элсэлтийн мэдэгдлээ надад өгнө үү.","Тэд хаана байна вэ?"],["Энэ байр үнэхээр сайн, тавилга шинэ, тоног төхөөрөмж сайн, бүр хивс ч бий.","Тийм, хамгийн гол нь компанид ойрхон. Тиймээс түрээс жаахан үнэтэй ч би түрээслэсэн.","Эрэгтэй зөвхөн аль талаар сэтгэл хангалуун бус байна вэ?"],["Өвчтөний зүүн хөл хугарсан, байдал ноцтой, зүрхний цохилт удааширсан, яаралтай мэс засал хийх хэрэгтэй.","За, би даруй мэс заслын өрөөнд бэлтгэхийг мэдэгдье.","Өвчтөний байдлын талаар аль нь зөв бэ?"],["Шуурхай хоол хэрэгтэй зорчигч байна уу? Зайрмаг, эрдэст усны сав ч бий.","Нэг хайрцаг хоол хэд вэ?","Энэ яриа хаана болж байна вэ?"],["Би энэ удаагийн хурлын илтгэгч зочин, энэ миний нэрийн хуудас.","Таны үнэмлэхээ үзүүлж өгч болох уу?","Эмэгтэй эрэгтэйг юу хийлгэж байна вэ?"],["Та программ хангамжийн хүн мэдэх үү? Бид сүүлийн үед шинэ бүтээгдэхүүн хөгжүүлж байгаа, нэг программ зохиох хүн хайж байна.","Би танд асууж өгье.","Эмэгтэйд ямар чиглэлийн мэргэжилтэн хэрэгтэй вэ?"],["Цаг агаарын мэдээнд өнөөдөр цэлмэг гэсэн, яагаад одоо дахиад аянга цахилгаантай болов?","Цаг агаарын мэдээнд хэзээ итгэх билээ?","Яриаг үндэслэн аль нь зөв бэ?"],["Чи яагаад ийм олон хувьцаа авав? Нэгэн дор төвлөрүүлбэл сайн биш гэж үү?","Өндгийг нэг сагсанд бүү хий.","Тэд юуны тухай ярьж байна вэ?"],["Миний хөх торгон зангиа хаана байна? Өнөөдөр костюм өмсөх хэрэгтэй.","Хуурай угаалгад өгсөн, мөнгөлөг өнгийнхийг зүү.","Тэд юуны тухай ярьж байна вэ?"],["Чи өнөөдөр ярилцлагад очих биш билүү? Үүнийг өмсөх юм уу?","Ярилцлага яасан юм бэ? Би инженерийн ажилд өргөдөл гаргаж байна, борлуулагч биш шүү дээ.","Юунд ч жинсэн өмдтэй явж болохгүй.","Ээж ээ, та мэдэхгүй, костюм өмсөх нь инженер шиг биш л дээ!","Эрэгтэйн талаар аль нь зөв бэ?"],["Орой гэртээ идэх үү, гадаа идэх үү?","Хөргөгчид юу байгааг харъя. Хоёр төмс, хиам, аа, бас шуудхан талх байна.","Ногоон юм ч алга, гадуур идсэн нь дээр.","За тэгье.","Эрэгтэй яагаад гадуур идэхийг хүсч байна вэ?"],["Та нарын хэн цэнэглэгчтэй вэ? Миний утасны цэнэг дуусах дөхлөө.","Чи интернэтийн функцээ унтраасан нь дээр, энд сүлжээний дохио муу, маш их цэнэг иддэг.","Яагаад тэр байж, ердийн үед миний утасны зай дор хаяж нэг өдөр тэсдэг юм.","Бид ч эхэндээ гайхсан, дараа нь асуудал хаана байгааг олсон.","Энэ газрын аль талд асуудал байна вэ?"],["Чи энэ бичсэн нь диссертаци юм уу? Бараг л бага сургуулийн зохиол!","Энэ бага сургуулийн зохиолоос хамаагүй урт шүү дээ!","Урт нь ямар хэрэг вэ? Бага сургуулийн зохиол ч гэсэн сэдэвтэй, логикийг анхаарна!","Та ийм битгий уурла.","Эрэгтэй энэ диссертацийг яаж үзэж байна вэ?"],["Чи аль хэдийн аялал жуулчлалын агентлаг руу очсон уу?","Тийм, хэд хэдэнээс асууж, зарим материал аваад ирсэн. Хараарай.","Агентлагтай хамт явбал чөлөөгүй, бас дэлгүүр хэсүүлэхээр чирэгдэх гэх мэт зүйл надад таалагдахгүй.","Тэгвэл яах вэ?","Аялал жуулчлалын агентлагт хандахтай холбоотой эмэгтэй ямар хандлагатай вэ?"],["Үлдсэн бүх эд зүйлийг тэр картон хайрцагт хийчихлээ.","Ийм олон юм, картон хайрцаг хангалттай бат уу?","Жаахан эрсдэлтэй ч бидэнд зөвхөн энэ нэг хайрцаг бий.","Олс олж уяхгүй юу?","Тэдэнд юу хэрэгтэй вэ?"],["Чи өнөөдөр яагаад байнга найтаагаад байна вэ?","Өчигдөр орой даарсан, өглөө халуурч бас байлаа.","Өө, ийм ноцтой халуурсан, эмнэлэг очсон уу?","Тэр үед очсон, эмнэлэг хараахан нээгдээгүй байсан, яаралтай үзлэгт бүртгүүлсэн.","Эрэгтэйн талаар юу мэдэж болох вэ?"],["Чи Сяо Литэй яг юу зөрчилдөж байна вэ?","Зөрчил гэх хэмжээний юм алга, зүгээр л түүнтэй тохиромжгүй.","Чи бусдад ихэвчлэн сайн зан гаргадаг, яагаад түүнийг л хараад дургүйцдэг юм бэ?","Түүнийг ярихыг сонсох бүрт хэдэн арван тойрог хийдэг, надад тийм тэвчээр байхгүй.","Эмэгтэй яагаад Сяо Лид дургүй вэ?"],["Нэхэмжлэх гаргаж өгөөч.","Аяа, уучлаарай, манай нэхэмжлэх дөнгөж дууссан.","Тэгвэл яах вэ?","Ингэе, би танд баримт бичиж өгье, дараа ирэхдээ нэг дор гаргая, болох уу?","Эмэгтэй юу авахыг хүсч байна вэ?"],["Миний дарга намайг үргэлж итгэдэггүй.","Яагаад ингэж хэлэв?","Тэр намайг томилолтоор явуулах бүрт тасралтгүй залгаж, бүх нарийн зүйлийг асуудаг.","Чи энэ нь чиний ажлын арга барилд асуудал байна гэсэн үг биш үү гэж бодож үзсэн үү? Та түүнтэй сайн харилцдаг уу?","Эмэгтэй юу гэсэн үг вэ?"],["Олж авах, алдах, эрэлхийлэх, орхих нь хүний амьдралд хамгийн энгийн хэрэг, бид тэдэнд хэвийн сэтгэлээр хандах ёстой. Үнэндээ бодож өгөх нь амьдралын хоёр тал юм. Нэг талыг авбал заримдаа нөгөө талыг орхих хэрэгтэй, яг л азгүйтэл ба аз хамт байдаг шиг. Дэлхий дээр олон хүн янз бүрийн шалтгаанаар өөрт нь байх ёстой зүйлээ алдсан ч, зэрэгцээ бусдын авч чадахгүй зүйлийг олсон.","Энэ хэсгээс аль нь зөв бэ?","Энэ хэсэг гол төлөв бидэнд юу хэлж байна вэ?"],["Саяхан хүмүүс нэг хөл бөмбөгийн сургалтын машин боловсруулж амжилтад хүрсэн. Энэ сургалтын машин нь том хөл бөмбөг шиг хэлбэртэй, дотор нь 25 хөл бөмбөг багтана. Машин хүмүүсийн өмнө нь бичсэн программын дагуу янз бүрийн өнцөг, янз бүрийн хүчээр хөл бөмбөгийг тасралтгүй харвадаг, бодит тэмцээнд тохиолдох янз бүрийн нөхцөл шиг. Тамирчид нисч ирж буй хөл бөмбөгтэй тэмцэхийн тулд янз бүрийн техникийн хөдөлгөөн тасралтгүй хийж, ингэж бэлтгэлийн зорилгод хүрнэ. Сургалтын машин ашиглавал тамирчдын техникийн түвшинг дээшлүүлэхээс гадна дасгалжуулагчдын цагийг хэмнэж, тэд өөр чухал зүйлд анхаарах боломжтой болно.","Хөл бөмбөгийн сургалтын машин хэрэглэхэд тамирчид юу хийх ёстой вэ?","Хөл бөмбөгийн сургалтын машин хэрэглэхийн давуу тал юу вэ?","Энэ хэсгээс хөл бөмбөгийн сургалтын машины талаар аль нь зөв бэ?"],["«Хятадын Бээжингийн дууриудын зуун сонгодог англи орчуулгын цуврал» шинэ номын нээлт 10-р сарын 19-нд Бээжингийн Дяоюйтайн зочид буудалд болов. Ерөнхий редактор Сунь Пин: Америкт заахад их сургуулийн номын санд Бээжингийн дууриудын англи хэл дээрх ганц ном ч олдохгүй байсныг мэдсэн гэж танилцууллаа. Сурагчид аргагүй хараад: «Багш аа, бид лавлах материалаа хаанаас олох вэ?» гэжээ. Бээжингийн дуурь бол дэлхийн гурав дахь том тоглолтын тогтолцоо боловч гадаадын уншигчдад зориулсан системтэй бичиг бараг байхгүй. Гадаадын уншигчид Бээжингийн дууриудын сэтгэл татам байдлыг мэдрэхийн тулд хэлний саадыг давах ёстой. 1930 онд Мэй Ланьфан «Бага хаан эзэгтэй»-г Англи руу авч очсон ч дууны үгийг англиар орчуулаагүй тул үзэгчдэд үнэлэхэд хэцүү байв. Хожим олон хүн орчуулах оролдлого хийсэн ч нөхцөлийн хязгаарлалтаас болж олон төрлийн харамсал үлдсэн. Одоо зуун Бээжингийн дууриудын англи орчуулгын цуврал гарсан нь тоо хэмжээ, чанараараа эрин үеийг тэмдэглэх ач холбогдолтой бөгөөд гадаадын уншигчдын «цангааг тайлж» байна.","Энэ ямар цуврал ном вэ?","Гадаадад Бээжингийн дууриудын материал олох яагаад хэцүү вэ?","Энэ хэсэг юунаас гарсан байх магадлалтай вэ?"],["Нэг загас гэнэт мууртай адил чадвар олохыг хүсэв. Тиймээс муур түүнийг хулгана барихад авч явахыг гуйв. «Юу? Хайрт найз минь,» гэж муур загаст хэлэв, «чи манай энэ мэргэжлийн тухай огт мэдэхгүй байна шүү!» «Энэ юу хэцүү юм бэ? Бид урьд нь далайд жижиг загас, сам хорхой ч байнга барьдаг байсан.» «За тэгье. Гэхдээ намайг сануулаагүй гэж битгий хэл.» Тэд агуулах дотор нуугдав. Муур хоромхон зуур нэг хулгана барив. Хулганаар тоглож цадаад, цадтал идсэний дараа л загасаа санав. Хөөрхий загас амаа ангайн хэвтэж, сүүл нь хулганаар хазуулж уначихсан, зөвхөн нэг амьсгал үлдсэн байв. Муур зөвхөн түүнийг мод шиг чирж цөөрөм рүү буцаав.","Загас гэнэт юу хийхийг хүссэн бэ?","Энэ түүхэнд загасны төгсгөл ямар болсон бэ?","Энэ түүх голдуу бидэнд юу хэлэх гэж байна вэ?"],["Сяо Гуань гэрлэсний дараа ажлаа орхиж, бүтэн цагийн гэрийн эзэгтэй болов. Нөхөр Сяо Ли гадаа тэмцэж, мөнгө олж гэр бүлээ тэжээв. Сяо Гуань бүтэн цагийн эхнэрийн дүрийг сайн гүйцэтгэхийг хичээж, жирэмсэлж, хүүхэд харж, гэрийн ажил хийж, нүд ирмэх зуур дөрвөн жил өнгөрөв. Сяо Ли сар бүр цалингаа Сяо Гуаньд өгөхөөс гадна гэрийн бусад хэрэгт огт оролцдоггүй. Хоёр хүн аажим зөрчилдөж, маргалдах бүрт өөрийн өнцгөөс зогсож, нэг нь гадаа ажиллахын хүнд, нөгөө нь гэрийн ажил хөтлөхийн амаргүйг ярьж, хэн ч нөгөөгөө ойлгоход хүрэхгүй.","Сяо Гуань, Сяо Ли хоёр ямар харилцаатай вэ?","Тэдний маргааны агуулга гол төлөв юу вэ?"],["Нэг хүн өндөг атгаж, хичнээн хүчтэй дарсан ч өндгийг хагалж чадахгүй. Өндөгний гадна зөвхөн нимгэн хальс байхад яагаад ийм бат бөх байна вэ? Учир нь өндөгний хальс түүний даах даралтыг хальсны хэсэг бүрт жигд тараана. Архитекторууд энэ нимгэн хальсан бүтцийн онцлогоор хөнгөн бас материал хэмнэсэн олон барилга зохиосон. Жишээ нь Ардын их танхим, Бээжингийн галт тэрэгний буудал зэрэг барилгын дээврүүд бүгд ийм бүтэцтэй.","Энэ хэсэг юуны тухай голдуу ярьж байна вэ?","Энэ хэсгээс барилгын аль хэсэгт ийм бүтцийг хамгийн их хэрэглэдэг вэ?"]]};
