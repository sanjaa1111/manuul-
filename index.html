<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 5 үгийн сан</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#c0392b;--ok:#2e8b57;--bad:#d64545;--bd:#e3dfd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181d;--card:#20242c;--tx:#eceef2;--mut:#9aa3b2;--ac:#e8695a;--ok:#4cc38a;--bad:#f06a6a;--bd:#343a46}}
:root[data-theme="dark"]{--bg:#16181d;--card:#20242c;--tx:#eceef2;--mut:#9aa3b2;--ac:#e8695a;--ok:#4cc38a;--bad:#f06a6a;--bd:#343a46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:17px;margin:24px 0 8px}
p.s{color:var(--mut);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.les{cursor:pointer;text-align:left;font:inherit;color:inherit}
.les b{display:block;margin-bottom:4px}.les small{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--ac)}
.hz{font-size:64px;text-align:center;margin:18px 0 4px;font-family:"Noto Serif SC","Songti SC",serif}
.py{text-align:center;font-size:22px;color:var(--mut);margin-bottom:8px}
.sp{display:block;margin:0 auto 18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.big{font-size:48px;font-weight:700;text-align:center;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.w{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}
.w:last-child{border:0}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
textarea{min-height:110px}
.x{background:none;border:0;color:var(--mut);float:right;font-size:13px}
.mn{width:min(260px,70vw);margin:8px auto 0}.mn.small{width:170px}
.mn svg{width:100%;height:auto;display:block;overflow:visible}
.mn .bob{animation:bob 3s ease-in-out infinite;transform-origin:100px 200px}
.mn .bl{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.mn .ear{animation:ear 5s infinite;transform-box:fill-box;transform-origin:center bottom}
.mn .tw{animation:tw 1.4s ease-in-out infinite}
.mn .sp{animation:sp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-12deg)}96%{transform:rotate(4deg)}}
@keyframes tw{0%{opacity:0;transform:translateY(0)}60%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
@keyframes sp{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1.1);opacity:1}}
.wel{text-align:center;padding-top:12px}
.ttl{font-family:"Marck Script","Segoe Script","Comic Sans MS",cursive;font-size:38px;line-height:1.15;margin:14px 0 6px;color:var(--ac)}
.zh{font-size:20px;color:var(--mut);margin-bottom:22px;font-family:"Noto Serif SC","Songti SC",serif;letter-spacing:4px}
.btn.big{font-size:20px;padding:14px 44px;border-radius:30px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn.big:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.msg{text-align:center;font-family:"Marck Script","Segoe Script","Comic Sans MS",cursive;font-size:26px;color:var(--ac);margin:4px 0 8px}
.bobi{width:100%;height:auto;display:block;animation:bobi 3s ease-in-out infinite;transform-origin:50% 100%}@keyframes bobi{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.02)}}.mn.small{width:190px}.cover{border-radius:20px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.22);margin:0 auto;max-width:520px}.cover img{display:block;width:100%;height:auto;animation:zoomin 1.2s ease-out both}@keyframes zoomin{from{transform:scale(1.08);opacity:.2}to{transform:scale(1);opacity:1}}.wel .ttl{margin-top:20px}
.opts2{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:6px}
.btn.big.alt{background:#2f6f8f}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.sc .no{font-size:12px;color:var(--mut)}
.sc .zhs{font-size:22px;line-height:1.55;font-family:"Noto Serif SC","Songti SC",serif;margin:4px 0 8px}
.sc .zhs .hl{color:var(--ac);font-weight:700}
.sc .mn2{font-size:15px;margin-bottom:8px}
.sc .play{float:right;margin-left:8px;border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:6px 12px}
.sc .det{border-top:1px dashed var(--bd);padding-top:8px;font-size:14px}
.sc .wd{padding:3px 0}.sc .wd b{color:var(--ac)}.sc .wd i{color:var(--mut);font-style:normal}
.sc .nt{margin-top:6px;color:var(--mut);font-size:13px}
body.hide .sc:not(.open) .mn2,body.hide .sc:not(.open) .det{display:none}
body.hide .sc:not(.open) .zhs{cursor:pointer}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.bar2 .btn{padding:8px 12px;font-size:14px}

.btn.big.gr{background:#2e8b57}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.ex .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.ex .qq{margin:10px 0 4px;font-size:15px}
.ex .ch{display:flex;gap:8px;margin-top:6px}
.ex .ch button{flex:1;padding:9px 0;border:1px solid var(--bd);background:var(--bg);border-radius:10px;font-weight:700}
.ex .ch button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.ex .ch button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.ex .scr{margin-top:8px;padding:10px;background:var(--bg);border-radius:10px;font-family:"Noto Serif SC","Songti SC",serif;font-size:16px;line-height:1.6;display:none}
.ex .scr.on{display:block}.ex .scr b{color:var(--ac)}
.sm{padding:6px 12px;font-size:13px;border-radius:18px;border:1px solid var(--bd);background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;font-size:13px}
.note2{font-size:13px;color:var(--mut);margin:8px 0 14px}

.play2{border:1px solid var(--bd);background:var(--bg);border-radius:14px;padding:2px 8px;font-size:12px}
.gn{color:var(--mut);font-size:12px;margin:2px 0 4px 32px}
.gn2{margin-top:6px;font-size:13px;color:var(--tx);background:var(--bg);border-radius:8px;padding:6px 8px}
.gn2 b{color:var(--ac)}
.sc .wd b.nw{color:var(--ac)}
.tl{font-weight:700;margin:6px 0 10px}
.wb{margin-top:8px}
.chp{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:3px 10px;margin:3px 4px;font-size:18px;font-family:"Noto Serif SC","Songti SC",serif;transform:rotate(-1.5deg)}
.chp:nth-child(even){transform:rotate(1.5deg)}
.oc{font-size:20px;font-family:"Noto Serif SC","Songti SC",serif;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:4px;color:var(--tx);position:relative}
.oc sup{font-size:11px;color:var(--ac);margin-right:3px}
.oc.used{opacity:.3}

function segment(t){

 for(var i=0;i<=n;i++)best[i]=-1e9;best[0]=0;

var TRM={"x19":[["Чи яагаад өнөөдөр ийм бага идэв? Эдгээр хоол чиний амтанд таарахгүй байна уу?","Хоёр хоногийн өмнөөс жаахан тавгүй байгаа, дуршил алга.","Эрэгтэй юу гэсэн үг вэ?"],["Энэ хиамны өнгө яагаад ийм байна? Ямар нэг асуудалтай юм уу?","Хөргөгчид хийчхээд мартчихсан, үйлдвэрлэсэн огноог нь хурдан хараарай.","Эрэгтэй хиамыг яасан гэж бодож байна вэ?"],["Тавтай морил! Уучлаарай, одоо суудал байхгүй байна, энд суугаад жаахан хүлээж болох уу? Энд зуушиг, цай бэлэн байна, түрүүлж аваарай.","Өө, баярлалаа! Би үдээс хойш танай газарт тусгай өрөө захиалсан юм, ноён Лигийн захиалга байгаа эсэхийг шалгана уу?","Эрэгтэй одоо хаана байгаа байх магадлалтай вэ?"],["Энэ цагаан лууван боовны хальс цаас шиг нимгэн, лууван нь улаан ногоон өнгөтэй, үнэхээр гоё.","Яасан, амттай биз? Энэ боов манай нутгийн онцлог хоол шүү.","Цагаан лууван боовны талаар юу мэдэж болох вэ?"],["Хагас жил уулзаагүй чи урьдынхаас хамаагүй туранхай болжээ. Яасан, сүүлийн үед турж байна уу?","Би урьдынхаас турсан уу? Би сүүлийн хэдэн сард тогтмол биеийн тамирын дасгал хийсэн, үнэхээр үр дүнтэй юм байна.","Эмэгтэйн тухай аль нь зөв бэ?"],["Бямба гарагийн үдээс хойш цугларалт болно, Лилигийн төрсөн өдрийг тэмдэглэнэ, чи заавал ирээрэй.","Би жаахан хожуу очвол яасан юм бэ? Үдээс хойш яг сургалт болно. Та нар хэдэн цагт эхлэх вэ?","Бямба гарагт эмэгтэй эрэгтэйг юу хийхийг хүсч байна вэ?"],["Би Линлинийг дахиад зууш идэж байхыг харлаа, чи түүнд ийм юм бага авч өгөөрэй.","Би түүнд шалгалтын дүн сайн бол нэг хүсэлтийг нь биелүүлнэ гэж амласан биш билүү?","Энэ чинь ямар хүсэлт гэж! Чи ч гэсэн зарчимтай байх хэрэгтэй.","Шарсан хоол эрүүл биш гэдгийг би мэднэ, жаахан иддэг л бол хангалттай.","Тэд гол төлөв ямар асуудлаар ярьж байна вэ?"],["Үйлчлэгч ээ, танай энд онцлох хоолнуудаа санал болгооч.","Бидний энд Сычуаний хоолны газар, хүмүүс ихэвчлэн мапо тофу захиалдаг.","За, нэгийг өгөөрэй.","Таны далайн хоолонд дуртай юу? Өнөөдөр хуурай шарсан шар загас хөнгөлөлттэй.","Яриаг үндэслэвэл аль нь зөв бэ?"],["Эмээ, супермаркетын органик ногоо бол бохирдолгүй ногоон хүнс, маш сайн зарагддаг.","Харин үнэ нь махнаас ч үнэтэй.","Одоо хүмүүс эрүүл мэндийг эрэлхийлдэг, өдөр бүр том загас, махтай хоол идэх нь сайн хооллох гэсэн үг биш.","Тийм ээ, одоо олон хүн баялгийн өвчтэй болж байна, хэтэрхий сайн идсэн биш гэж үү?","Яриаг үндэслэвэл эмэгтэй ямар үзэлтэй санал нийлж байна вэ?"],["Би зуушиг хийлээ, амсаад үзээрэй.","Амт үнэхээр сайн, их амттай. Хэнээс сурсан бэ?","Энэ манай нутгийн онцлог хоол, шинэ жилээр гэртээ харихад эмээ надад зааж өгсөн.","Тийм байж, би хэзээ ч идэж үзээгүй юм байна.","Энэ зуушийн талаар юу мэдэж болох вэ?"],["Би чамд заая, махыг нарийн зүсээд, чинжүү, төмсийг ч адил, шарахдаа соёон соусыг бага хий.","Хөнгөн амттай байлгахыг хүсч байна уу?","Давс амтыг өөрийн амтаар тохируулна, гол нь өнгө нь гоё болгох.","Тэгвэл жаахан морковийн нарийн зүсмэл нэмбэл бүр ч гоё харагдахгүй юу?","Мэдээж. Гэхдээ зарим хүн тэр амтанд дургүй.","Надад асуудалгүй, шим тэжээл баялаг байх нь илүү чухал.","Эрэгтэй эмэгтэйд энэ хоолыг хэрхэн хийхийг хэлсэн бэ?","Хоол хийхдээ эмэгтэй юуг илүү чухалчилдаг вэ?"],["Шинжаны Турфаны усан үзмийн тухай ярихад заавал дурдах хэрэгтэй. Энд яагаад ийм амттай усан үзэм ургадаг вэ? Үнэндээ энэ нь орон нутгийн уур амьсгалтай их холбоотой. Энд уур амьсгал хуурай, цэлмэг өдөр олон, үүлэрхэг өдөр цөөн, түүнчлэн өргөрөг өндөр тул зуны нарны гэрэл удаан, эрчтэй бөгөөд усан үзэмд удаан хугацаанд фотосинтез хийх боломж олгож, их хэмжээний органик бодис, сахар үйлдвэрлэнэ. Шөнө болоход агаарын температур маш бага болж, ургамлын амьсгалалт сулрах тул тэжээллэг бодисын алдагдал буурна. Тиймээс жимс шим тэжээлийг их хуримтлуулж, зөвхөн том биш бас маш чихэрлэг болдог.","Энэ хэсгээс Турфаны усан үзмийн амт нь юутай их холбоотой вэ?","Энэ хэсгээс шөнийн бага температур усан үзмийг юу болгодог вэ?"]],"x20":[["Аав аа, Яан Яан таны хуучин зургийн түүхтэй номуудад маш их дуртай, ялангуяа «Баруунд аялсан тэмдэглэл»-ийн цуврал.","Чи сайн хадгалаарай, бүү эвд, одоо тэд цуглуулгын эд болсон.","Эрэгтэй тэр жижиг номуудыг ямар гэж үзэж байна вэ?"],["Энэ удаа финалд гараагүй, би хэт ихэмсэг байлаа, өрсөлдөгчөө дутуу үнэлж, бэлтгэл хангалтгүй байсан.","Зүгээр, буцаад туршлагаа сайн дүгнээд, ирэх жил дахин ир.","Эрэгтэй хэн байх магадлалтай вэ?"],["Лю Фан нас хэдийнэ ахиж ч нөхөргүй байна, танай сургуульд тохирох хүн байна уу? Нэгийг нь танилцуулъя.","Биеийн тамирын багш болох уу? Манай Жао багш урьд нь бойжилтын аварга болж байсан.","Лю Фангийн талаар аль нь зөв бэ?"],["Чи яасан бэ? Байнга найтааж, хамраа гоожуулаад байна, ханиад хүрсэн биз?","Хавар болгонд миний цэцгийн тоосонд харшилтай хуучин өвчин дахин сэдэрдэг.","Эрэгтэй яасан бэ?"],["Танай байгууллагад шинэ ирсэн Сяо Ли яаж байна?","Тэр ердийн үед цөөхөн ярьдаг ч ажлаа хийхдээ маш шаргуу, хичнээн ядарсан ч гомдоллодоггүй.","Сяо Лигийн ажлын гүйцэтгэлийн талаар юу мэдэж болох вэ?"],["Чи яагаад ийм хурдан буцаж ирэв? Номын сангийн үнэмлэхээ хийлгэв үү?","Үгүй, журам нь амархан ч бүртгүүлэхдээ барьцаа мөнгө өгөх ёстой гэдгийг мэдээд, надад тийм их мөнгө байсангүй.","Эмэгтэй яагаад номын сангийн үнэмлэх хийлгэж чадсангүй вэ?"],["Сүүлийн үед оюутны үнэмлэхээ олохгүй байна.","Тэгвэл хурдан дахин авчих, удахгүй төгсөх гэж байна, үнэмлэхгүй бол тэр үед яаж журам бүрдүүлэх юм бэ?","Үүнд ямар хамаа байна вэ?","Дүрмээр, сургуулиас гарах журам бүрдүүлэхэд оюутны үнэмлэхээ өгч чадахгүй бол барьцаа мөнгөө буцаахгүй.","Оюутны үнэмлэхийн талаар эмэгтэй эрэгтэйг юу хийхийг хүсч байна вэ?"],["Чи надад санал өгөөч, энэ хоёр утасны аль нь илүү вэ?","Би том дэлгэцтэйд тийм ч дургүй, том нь жаахан тэнэг харагдаж, боловсруулах хурд нь ч жижиг нь шиг хурдан биш.","Хэмжээ надад хамаагүй, гэхдээ энэ утасны биеийн гүйцэтгэл жаахан барзгар.","Тэгвэл жижиг нь ав.","Эрэгтэй яагаад том дэлгэцтэй утсыг авахгүй байна вэ?"],["Чи бие галбираа ийм сайн байлгаж байна, өдөр бүр биеийн тамирын заал явдаг юм уу?","Үгүй ээ, долоо хоногт хоёр удаа сэлдэг л дээ. Усан сан гэрт ойрхон, нэлээн тохиромжтой.","Үнэхээр атаархмаар байна, манай гэрийн дэргэд гүйх цэцэрлэг олох гэвэл таван зургаан км-ээс цааш явна.","Тэгвэл хурдан нүү.","Чи амархан хэлж байна.","Эмэгтэй эрэгтэйн юунд атаархаж байна вэ?"],["Би урьд нь танай гэрт «Гурван вант улсын домог»-ийн зургийн түүхтэй ном харж байсан санагдаж байна, тийм биз?","Тийм, тэр бол багад өвөө надад авч өгсөн.","Одоо ч байгаа юу? Тэр цуврал маш их цуглуулгын үнэ цэнтэй, үнэ нь ч галзуу өссөн гэсэн.","Хичнээн үнэтэй байсан ч зарахгүй, тэр цуврал дурсгалын утгатай.","«Гурван вант улсын домог»-ийн зургийн түүхтэй номын талаар эмэгтэй ямар утгатай хэлж байна вэ?"],["Манай ойролцоох эмнэлэгт нэг хөгшин хятад анагаах эмч байдаг, судас барих нь онцгой оновчтой, өвчтөн өөрөө хэлэхгүй ч судас барьсныхаа дараа ямар өвчтэй болохыг мэддэг. Тэр өдөр би ходоод жаахан тавгүй санагдаж, хөгшин эмчээс үзүүлэхээр шийдлээ. Гэрийн даалгавраа хийж байсан хүү маань хэлэв: «Аав аа, би дөнгөж даалгавраа дуусгалаа, би та нартай хамт явна, та хэдэн өдрийн өмнө надад тоглоом авч өгнө гэж амласан, өнөөдөр заавал аваарай.» Эмнэлэгт очиход би үг ч хэлсэнгүй, хөгшин эмч судас барьж «Таны өвчин ходоодонд байна» гэв. Би толгой дохиод «Эмч ээ, миний хүүг ч үзээрэй» гэв. Хүү сонсоод яаран ухрах хэлэв: «Больё, би буцаад даалгавраа дуусгая.» Дуусгаагүй байсан хүү хөгшин эмч судас барьж худлаа хэлснийг нь мэдчих вий гэж айсан байжээ.","Энэ хөгшин эмч өвчтөн үзэхдээ хэр вэ?","Хүү яагаад хамт эмнэлэгт явахыг хүссэн бэ?"],["Эрч хүчтэй нэг эмээ автобусанд сууна. Автобусанд суухад эелдэг хүүхэд босож эмээд суудлаа тавьж өгөхөд, эмээ: «Чи сууж бай, би маш залуу, чиний суудал надад хэрэггүй!» гэв. Хэсэг хугацааны дараа хүү дахин босоход эмээ мөрийг нь налан: «Зүгээр ээ, чи надад суудал тавьж өгөх хэрэггүй, би тийм хөгшин биш, би залуу!» гэв. Ингэж гурав дөрвөн удаа болоход хүү уйллаа! Тэр уйлсаар хэлэв: «Эмээ, миний гэр хэдэн буудлаас өнгөрчихлөө, та яагаад намайг буулгахгүй байна вэ?»","Автобусанд эмээ яагаад суухгүй байсан бэ?","Хүүгийн талаар юу мэдэж болох вэ?"]],"x21":[["Сайн байна уу! Би интернэтээр утасны төлбөрөө шалгаж байна, нууц үг оруулахыг шаардаж байна, гэтэл би хэзээ ч нууц үг тохируулаагүй шүү дээ!","Та утасны дугаараа оруулж, санамсаргүй нууц үг авахыг сонгоод нэвтэрч болно.","Эрэгтэй юу хийхийг хүсч байна вэ?"],["Чи сүүлийн үед яагаад Ли Янтай бадминтон тоглохгүй байна вэ?","Тэр сургуулийн илтгэлийн тэмцээнд оролцсон, давтан шатанд шалгарчихсан, энэ хугацаанд бэлтгэлд завгүй байна.","Ли Ян сүүлийн үед юугаар завгүй байна вэ?"],["Энэ удаа засварласан диссертацийг та яаж үзэж байна?","Дүгнэлтийн хэсгийг дахин төгөлдөржүүлэх шаардлагатай гэж үзэж байна, харамсах зүйл үлдээхгүй, цагаа үр дүнтэй ашигла.","Эмэгтэй энэ диссертацийг яаж үзэж байна вэ?"],["Ийм оройтсон байхад чи яагаад дахиад илүү цагаар ажиллаж байна вэ?","Дарга Ма нэрсийн жагсаалтад дахин өөрчлөлт орсон гэсэн, тогтвортой болмогц надад и-мэйл илгээнэ, би жаахан хүлээнэ.","Эмэгтэй одоо юу хийж байна вэ?"],["Миний аав хорь гаруй жил тамхи татсан, одоо л хаяна гэхээр хаяад байна.","Үнэхээр биширмээр. Тамхи хаяхад гол нь шийдэмгий байх эсэх.","Эрэгтэй тамхи хаяхыг юу гэж үзэж байна вэ?"],["Сүүлийн хэдэн өдрийн хуваарь яагаад ийм дүүрэн байна? Биеэ анхаараарай.","Санаа зовох хэрэггүй, энэ гэрээг тохирчихвол бид хэд хоног далайн эрэг очиж амарна.","Эрэгтэй сүүлийн үед яаж байна вэ?"],["Чи яагаад өглөө эрт хэвтэж үглээд байна, өчигдөр сайн унтсангүй юу?","Миний хамгийн сайн найз эх орноо ирж над дээр ирээд манайд буусан.","Олон жил уулзаагүй тул ярих юм их биз.","Тийм ээ, бид хоёр шөнөжин унтсангүй ярилцсан.","Эмэгтэйн талаар яриаг үндэслэн юу мэдэж болох вэ?"],["Чи диссертацаа ийм хурдан бичиж дуусгав уу? Үнэхээр биширмээр!","Би хамгийн хурдан нь биш, Лю Жин хамгаалалтдаа бэлдэж байна.","Миний судалгааны асуулга хараахан цугларсангүй, та нарыг хараад үнэхээр сандарч байна.","Тийм их сандрах хэрэггүй, эрт орой хамаагүй, тэнцэх нь л чухал.","Эрэгтэйн диссертацийн талаар яриаг үндэслэн юу мэдэж болох вэ?"],["Энэ хэдэн хоногт чамайг харсангүй, дадлагад явсан уу?","Сүүлийн үед хэд хэдэн байгууллагад гүйж, олон анкет өгсөн.","Ярилцлага тэнцсэн үү? Аль нэг байгууллага авсан уу?","Авсан нь авсан, гэхдээ явах эсэхээ хараахан шийдээгүй.","Эрэгтэйн тухай яриаг үндэслэн юу мэдэж болох вэ?"],["Айлчлалын хуваарийг би үзсэн, маш дүүрэн, зарим газар нь үндэслэлгүй.","Тийм, би холбогдох хэлтэстэй зөвлөлдөж байна, зарим нарийн зүйлийг дахин төгөлдөржүүлэх хэрэгтэй.","Сайн, мэдээ гарангуут надад цаг тухайд нь мэдэгдээрэй.","Санаа зовох хэрэггүй, амралтын өдөр гэхэд таны гарт очино.","Айлчлалын хуваарийн талаар эрэгтэй юу гэж үзэж байна вэ?"],["Ийм нэг егөөтэй яриа бий. Хоёр ажилчин чийдэн суурилуулж байв, нэг нь нөгөөгийнхөө мөр дээр гишгэсэн. Нэлээн хугацаа өнгөрөхөд доорх хүн дээрх хүнийг юу ч хийхгүй байхыг хараад асуув: «Хөөе, суулгаж дууслаа юу?» Дээрх хүн хэлэв: «Энэ чинь эрэг шураг бүхий чийдэн гэдгийг мэдэхгүй юу? Чи эргэхгүй бол би яаж суулгах юм бэ?» Ажил дээр хүний мэдлэг, чадвар үргэлж хязгаартай гэдгийг хүлээн зөвшөөрөхөөс аргагүй, найзуудынхаа мэдлэг, туршлага, чадварыг ашиглан төслийг хамтдаа гүйцэтгэх нь ухаалаг сонголт. Гэхдээ үүнээс болж өөрийнхөө хүчин чармайлтыг бүрэн орхиж болохгүй.","Энэ хоёр ажилчны талаар юу мэдэж болох вэ?","Энэ хэсэг гол төлөв бидэнд юу хэлэх гэж байна вэ?"],["Эртний нэг хүн маш хувиа хичээсэн, бусдын хэрэгт хэзээ ч санаа тавьдаггүй, байнга «Бусдын хэрэг, тэнгэр шиг том ч хамаагүй» гэдэг байжээ. Тиймээс хүмүүс түүнд «Тэнгэр хамаагүй» гэдэг хоч өгчээ. Нэгэн өдөр «Тэнгэр хамаагүй» нэг уут будаа авч нуруундаа үүрээд гэртээ харив. Замд уут урагдаж, будаа тасралтгүй гоожив. Хамт явсан хүн харж: «Бусдын хэргийг хамаарах уу?» гэж асуухад тэр бодолгүйгээр: «Тэнгэр шиг том ч хамаагүй» гэв. Хэсэг хугацааны дараа будаа нэлээн гоожив. Хамт яваа хүн дахин: «Бусдад ашигтай хэргийг хүртэл хамаарахгүй гэж үү?» гэхэд тэр дахин: «Надад ашиггүй бол зуун ч хамаагүй!» гэв. Гэрт ойртоход «Тэнгэр хамаагүй» мөр хөнгөрснийг мэдэрч, нэг уут будааны тал нь гоожчихсоныг тэр үед л анзаарав. Тэр уурлаж, яарч, хамт яваа хүнийгээ зэмлэв: «Чи яагаад надад эрт хэлээгүй юм бэ?» Хамт яваа хүн түүний аяыг дуурайн: «Хамаагүй, хамаагүй, зуун ч хамаагүй!» гэв.","Энэ хэсгээс бусад хүн яагаад тэр хүнийг «Тэнгэр хамаагүй» гэдэг вэ?","«Тэнгэр хамаагүй»-ийн талаар аль нь зөв бэ?"]],"x22":[["Багш аа, манай хүүхэд ердийн үедээ ном унших их дуртай, гэтэл яагаад зохиол сайн бичиж чаддаггүй юм бэ?","Ном олон уншвал зохиол сайн бичнэ гэж үзэх нь нэг талыг барьсан үзэл.","Багшийн үзэл бодол юу вэ?"],["Интернэтээр бүртгүүлэх материалыг сайн харах хэрэгтэй. Нэгэнт илгээчихвэл өөрчилж болохгүй гэдгийг мэд.","Санаа зовох хэрэггүй, би хэд хэдэн удаа хартал.","Эрэгтэй яагаад эмэгтэйд материалаа сайн харахыг хэлсэн бэ?"],["Хүү минь, чиний төгсөлтийн ажил хэр болсон бэ?","Ажлын тухайд би материал олчихсон, ихэнхийг нь бичсэн, жаахан засвар хийвэл бараг дуусна.","Эрэгтэйн ажил одоо ямар байдалтай байна вэ?"],["Чи хүүгийнхээ олсон охинд дургүй биш билүү?","Хүүхэд том болсон, өөрийн гэсэн шийдэлтэй болсон, би яах вэ?","Эмэгтэйн өнгө аяс ямар байна вэ?"],["Би энэ төлөвлөгөөг дөрвөн удаа хийлээ, одоо ч сэтгэл хангалуун бус байна.","Төгс төлөвлөгөө гэж байдаггүй, эхлээд хийгээд үз.","Эрэгтэй энэ төлөвлөгөөг яаж үзэж байна вэ?"],["Энэ номын сэдэв чамд сонирхолтой биз дээ?","Тийм, гэхдээ гарчгийг нь эргүүлж үзтэл сонирхолгүй санагдлаа, нийтлэл хэдийг уншсан нь дээр.","Тэд юуны тухай ярьж байна вэ?"],["Уучлаарай, зохиол энд байхгүй, та хоёрдугаар давхарт очиж зээлж болно.","Хоёрдугаар давхрын ном зээлдэг газрын багш надад шинэ ном бүгд нэгдүгээр давхрын уншлагын танхимд гэж хэлсэн.","Аа, нэгдүгээр давхарт хоёр уншлагын танхим бий, манай талд зөвхөн байгалийн шинжлэх ухааны ном, хүмүүнлэгийнх нөгөө үзүүрт.","За, баярлалаа.","Ярьж буй хүн одоо хаана байна вэ?"],["Чи энэ удаагийн шалгалтад яагаад ийм муу өгсөн бэ? Шалгалтын өмнө давтаагүй юм уу, эсвэл бие тавгүй байв уу?","Аль нь ч биш, би шалгалтын үеэр хэтэрхий сандарчээ.","Тийм үү? Шалгалтад сандрах зайлшгүй ч нөлөө нь ийм их байна гэж бодсонгүй.","Дараагийн удаа тохируулах арга олно.","Эмэгтэй яагаад шалгалтад сайн өгсөнгүй вэ?"],["Энэ удаагийн хэрэгт чи хэтэрхий хэтрүүлжээ!","Эхлээд миний тайлбарыг сонс, би ингэсэн нь шалтгаантай.","Чи надад сайн шалтгаан хэлсэн нь дээр.","Мэдээж, битгий яар, би аажуухан хэлье…","Эмэгтэйн өнгө аяс ямар байна вэ?"],["Чи Золбоо ордонд ороод хойно хойд эхтэй нь яаж харьцах ёстой гэж үзэж байна вэ?","Асар их аз жаргал эзэмшсэн хүн бусдыг уучилж, ойлгох ёстой.","Гэхдээ хойд эх нь түүнд хор учруулж байсан биз дээ?","Хойд эх нь маш хувиа хичээсэн ч эх хүний хувьд өөрийн охин, хойд охины хооронд бүрэн тэгш байх хэцүү, энэ бас хүний мөн чанар.","Золбоогийн хойд эхийн тухайд эмэгтэй ямар үзэлтэй байна вэ?"],["Францын зохиолч Дюма Оросоор аялж байхдаа нэгэн хотод ирж, хотын хамгийн том номын дэлгүүрт зочлохоор шийдэв. Номын дэлгүүрийн эзэн зохиолч ирнэ гэж сонсоод бүх тавиурыг Дюмагийн номоор дүүргэж, түүнийг баярлуулахыг хүссэн. Дюма дэлгүүрт орж тавиур бүр өөрийн бүтээлээр дүүрсэнийг хараад маш их гайхав. Тэрээр асуув: «Бусдын ном хаана вэ?» Эзэн энэ асуултад огт бэлтгээгүй байсан тул түгшиж: «Бусдын ном... бүгд зарагдсан» гэв.","Номын дэлгүүрт яагаад бусдын ном байхгүй байсан бэ?","Энэ үлгэр биднийг юу гэж сургаж байна вэ?"],["Нэгэн агуу зохиолч бичихдээ хэзээ ч суудаггүй хачин зуршилтай гэдэг. Хүмүүс шалтгааныг нь асуухад тэр: «Суухад тухтай, тиймээс бичиж эхэлмэгц дуусахгүй. Удаан зогсвол хөл өвдөж, чи хурдан бичээд хурдан суухыг бодно» гэжээ. Энэ түүх зүгээр л хошигнол байж болох, зохиолын урт, богино нь суугаад эсвэл зогсоод бичихтэй том хамаагүй. Гэвч энэ нь бидэнд нэг асуудлыг бодоход хүргэнэ: Хэрэв бид бүгд түүн шиг зогсоод бичвэл бүх зохиол илүү товч, илүү уншигдахуйц болох болов уу?","Энэ зохиолч яагаад зогсоод бичдэг вэ?","Зохиолын урт богинын талаар ярьж буй хүн ямар хандлагатай вэ?"]],"x23":[["Энэ хэргийн тухайд би чамд эхлээд буцаж очоод эцэг эхийнхээ санал асуухыг зөвлөе.","Багш аа, би эцэг эх минь намайг дэмжинэ гэдэгт итгэж байна.","Энэ хэргийн талаар багшийн үзэл бодол юу вэ?"],["Оксфордын Их Сургуулийн шиг дэлхийн алдартай сургуульд элсэх сайхан юм! Чи яаж татгалзаж чадаж байна вэ?","Оксфорд мэдээж сайн, гэхдээ би Америк явахыг хүсч байна.","Эмэгтэй юу гэсэн үг вэ?"],["Бид эцэст нь нэгдмэл саналд хүрлээ, үнэхээр амаргүй байлаа.","Бүгдийн зорилго хэзээ ч нэг л байсан, бүгд компанийн сайн сайхны төлөө.","Эрэгтэй юу гэсэн үг вэ?"],["Сяо Ван, чи яагаад өөрийн үзэл бодлоо хэлэхгүй байна вэ?","Та бидэнд санал нийлэхгүй байхыг зөвшөөрөхгүй, би чимээгүй байхаас өөр аргагүй.","Эмэгтэйн хандлага ямар байна вэ?"],["Чи Вэнь Вэнтэй одоо ямар түвшинд хүрсэн бэ?","Өчигдөр би түүнийг анх удаа үнсэв.","Эрэгтэй Вэнь Вэнтэй ямар харилцаатай байх магадлалтай вэ?"],["Чи сонссон уу, өчигдөр 34-р маршрутын автобус осолдсон!","Тийм ээ, би гэртээ харихдаа тэр автобусаар байнга явдаг! Аз болоход өчигдөр илүү цагаар ажиллаж оройтсон тул таксигаар явсан.","Эмэгтэй өчигдөр яагаад 34-р автобусанд суугаагүй вэ?"],["Чи ийм настай болоод яагаад ийм зовж хөдөлмөрлөдөг юм бэ? Бизнесээ хүүдээ даатга.","Тэр найдваргүй биш байсан бол би аль эрт даатгасан байх.","Хүү чинь юугаараа муу вэ? Чи үргэлж түүнд итгэдэггүй!","Чи бас хэлээд байна, бүгдийг чи түүнийг эрхлүүлж муутгасан! Би зүүн гэхэд тэр заавал баруун гэдэг!","Ярьж буй хүмүүс ямар харилцаатай байх магадлалтай вэ?"],["Ээж ээ, би ажилдаа явахад та ч бас гадуур явж болно, өдөржин гэртээ хаалттай байх хэрэггүй.","Би гадаад хэлний ганц ч өгүүлбэр мэдэхгүй, яаж гарах юм бэ?","Санаа зовох хэрэггүй, та эхлээд ойролцоох супермаркет үзээрэй. Би танд газрын зураг бэлдэж, манай гэрийн хаягийг бичиж өгье, олохгүй бол бусдад үзүүлээрэй.","Тэгвэл маргааш оролдож үзье.","Эмэгтэй яагаад гадагш гарахыг хүсэхгүй байна вэ?"],["Энэ удаа шагнал авсанд та юу хэлэх вэ?","Энэ шагналыг авч чадсан нь бүгдийн хүлээн зөвшөөрөл, тусламж, удирдлагын халамж, бүр сайн санааны шүүмжлэлд бүрэн тулгуурласан.","Тэгвэл та хамгийн их хэнд талархах вэ?","Хамгийн их гэр бүлдээ талархана. Тэдний урамшуулал, дэмжлэггүй бол би тэсч чадахгүй байсан.","Эрэгтэй юунд хамгийн их талархаж байна вэ?"],["Хичээл эхэллээ, Сяо Мин яагаад ангийн гадаа зогсож байна вэ?","Ли багшид торгуулж зогсож байгаа байх, дахин дэггүйтсэн байх.","Хүүхэд сахилга зөрчсөн ч биеийн шийтгэл хийж болохгүй!","Тийм, хичээлийн дараа Ли багштай ярилцъя.","Эрэгтэй юу гэсэн үг вэ?"],["Хүүхдийн боловсрол нийгэмд онцгой анхаарал татдаг асуудал. Олон эцэг эх хүүхдээ хүмүүжүүлэх талаар олон онол сурч, өөрийн үзэлтэй, сонсоход бүгд учиртай. Гэвч бодит амьдралд эцэг эх нар тэр онолоор тогтмол хийдэггүй. Тэд: «Учир нь энгийн, би хэтэрхий завгүй, тэр онолоор хүүхдээ хүмүүжүүлэх цаг байхгүй, сургууль, багш нар хийж өгөөсэй» гэдэг.","Бүх нийгэм ямар асуудалд онцгой анхаардаг вэ?","Эцэг эхчүүд яагаад боловсролын онолоор хийдэггүй вэ?"],["Би өөрөө математикийн багш боловч охин маань багаасаа математикт маш дургүй, дүн муу байлаа. Нэг өдөр би охиндоо 10 бодлого өгөхөд охин 9-ийг нь алдсан. Би уурлаагүй, харин ч түүнийг маш их магтав: «Ийм хэцүү бодлогыг чи бүр зөв бодож чадлаа! Би багадаа нэгийг ч бодож чадахгүй байсан!» Маргааш орой нь би хэцүү байдлыг бууруулсан 10 бодлого бэлдэж өгөхөд тэр энэ удаа 5-ыг зөв хийв. Би охиноо урамшуулав: «Аан, чи үнэхээр гайхалтай! Нэг өдөрт ийм ахиц гаргалаа!» Гуравдахь өдөр охин өөрөө: «Аав аа, өнөө орой бас математикийн бодлого хийцгээе!» гэв. Хагас жилийн дараа охин ангийнхаа математикийн төлөөлөгч болов.","Охин хоёрдахь өдөр яагаад олон зөв хийсэн бэ?","Энэ хэсэг гол төлөв юуны тухай ярьж байна вэ?"]],"x24":[["Ангид онцгой анхаарах сурагч байна уу?","Чи Жао Фүгэнд илүү анхаараарай. Тэр хичээл дээр хэзээ ч үг хэлдэггүй, олон хичээлд тэнцдэггүй, ердийн үед ангийнхантайгаа бараг харьцдаггүй.","Жао Фүгэний асуудал аль нь вэ?"],["Чи интернэт хичээл үзэж байна гэсэн, ямар санагдаж байна?","Муугүй. Чи ч бас бодоод үз, хоёр долоо хоног үнэгүй сонсож болдог, би сонсоод сайн гэж үзсэний дараа л албан ёсоор бүртгүүлсэн. Одоо хоёр сар болж байна.","Эмэгтэй энэ хугацаанд юу хийж байна вэ?"],["Тэр энэ удаагийн тэмцээнд ямар дүн гаргав?","Харамсалтай нь мөнгөн медаль, нэг л хором дутаж аварга болох байлаа.","Тэр энэ тэмцээнд хэддүгээр байр эзэлсэн бэ?"],["Төлөвлөгөө ийм сайн байхад ийм хэрэг гарна гэж үнэхээр санасангүй!","Хэрэг гарахаас айх хэрэггүй, одоо бидэнд хамгийн чухал нь өөрсдөө хариуцлага хүлээж, түргэн арга хэмжээ авах.","Эмэгтэй яах ёстой гэж үзэж байна вэ?"],["Чи яг ямар найз охинтой болохыг хүсч байна?","Царайлаг эсэх, ажил сайн эсэх, мөнгөтэй эсэх хамаагүй, би зөөлөн, халамжтай байхыг л хүсэж байна.","Эрэгтэй найз охин сонгохдоо юуг хамгийн чухалчилдаг вэ?"],["Тэд хоёр сайхан байсан биш билүү, яагаад гэнэт салчихав?","Айл бүр өөрийн гэсэн хүнд зүйлтэй, бусдын төлөө санаа бүү зов.","Эмэгтэй юу гэсэн үг вэ?"],["Аав аа, маргааш багш манайд гэрийн айлчлал хийхээр ирнэ.","Маргааш би завгүй, ээжид хэл.","Багш онцлон хэлсэн, гэрийн айлчлал бүр ээжтэй уулзсан, эцэг эхийн хуралд ч ээж явдаг, энэ удаа аавтай уулзахыг хүсч байна.","За, маргааш би эхлээд компанид очиж зохицуулаад ирье.","Маргааш багш аавтай хаана уулзах вэ?"],["Лю багш аа, чөлөөт цагаараа надад нэмэлт хичээл зааж өгч чадах уу?","Уучлаарай, болохгүй байх.","Би тусдаа төлбөр төлж болно.","Манай сургуульд багш өөрийн сурагчид төлбөртэй нэмэлт хичээл заахыг хориглосон журамтай.","Эмэгтэй яагаад эрэгтэйд нэмэлт хичээл зааж өгөхгүй байна вэ?"],["Хүү яагаад гадагш гарч дэлхийг үзэхийг хүсдэгийг үнэхээр ойлгохгүй байна, манайх мөнгөөр дутдаггүй шүү дээ!","Эрэгтэй хүүхэд гадагш гарч туршиж үзэх нь ч сайн.","Яаж тийм амархан байх вэ?","Чи түүнд оролдуулахгүй бол тэр чадахгүй гэдгийг яаж мэдэх вэ?","Эрэгтэй юу гэсэн үг вэ?"],["Ийм оройтсон байхад чи яагаад унтаагүй байна вэ?","Маргааш миний үг хэлэх ээлж, дахин хоёр удаа давтах хэрэгтэй.","Бараг л болох, ийм нухацтай хэрэггүй.","Хэрэв миний өөрийн хэрэг байсан бол зүгээр, гэтэл энэ нь бүлгийн дүнд тооцогдоно.","Эмэгтэй яагаад унтаагүй байна вэ?"],["Хао багш аа, та суурин хотод багшлахаар ирээд нэг жил гаруй болсон, ядаргаатай биш үү?","Ядаргаатай нь ядаргаатай ч, би энд ирсэн нь баярлаж таашаахын тулд биш.","Энд нөхцөл муу, ирсэн эхэнд сайн дасаагүй биз дээ?","Нөхцөл хүнд ч миний олж авсан нь өгсөнөөсөө хамаагүй их гэж би үзэж байна.","Цаашид сайн дурын ажилтан болох уу?","Цаашид хаана байсан ч би хүчээ дайчлан уулын хүүхдүүдэд тусалсаар байна, учир нь хүүхдүүд бол манай улсын ирээдүй, итгэл найдвар.","Дэмжлэгийн багшлах талаар Хао багш ямар үзэлтэй вэ?","Хао багш ирээдүйд ямар төлөвлөгөөтэй вэ?"],["Өнөөдөр манай энэ их сургуулийн хотхонд олон дунд сургуулийн найзууд ирлээ. Улс орны өнцөг булан бүрээс 2500 гаруй ахлах сургуулийн сурагч Цинхуагийн хотхонд цугларч, 2016 оны залуучуудын их дээд сургуулийн шинжлэх ухааны хуаранд оролцож байна. Юуны өмнө Цинхуагийн Их Сургуулийг төлөөлөн ирсэн сурагчид, багш нарт халуун дотноор тавтай морилно уу хэлье! 2012 онд эхэлсэн залуучуудын шинжлэх ухааны хуаранд 4 жилийн дотор 37000 гаруй хуарангийн гишүүн оролцож, зохион байгуулагч сургууль анх 41-ээс 51 болж нэмэгдсэн, шинжлэх ухааны хуаран нь шинжлэх ухааны мэдлэг, сэтгэлгээ, аргыг түгээх, залуучуудын шинжлэх ухааны чанарыг дээшлүүлэх чухал тавцан болсон. Цинхуа бол шинжлэх ухааны хуарангийн анхны оролцогч бөгөөд идэвхтэй зохион байгуулагч, 2013 онд улсын нээлт Цинхуагийн хотхонд болсон, бид дахин шинжлэх ухааны хуаран зохион байгуулахад бэлэн, шинжлэх ухааны мөрөөдөлтэй бүх сурагчдад илүү өргөн тайз бий болгоно.","Энэ ямар арга хэмжээнд хэлсэн үг вэ?","Энэ арга хэмжээний талаар аль нь зөв бэ?"]],"x25":[["Чи Хуа уулыг авирсан гэсэн үү? Сэтгэл хөдөлгөм байсан биз?","Тийм ээ, зарим газар уулын зам маш явцуу, айгаад хөл чичирсэн.","Эмэгтэй уул авирахдаа ямар мэдрэмж төрсөн бэ?"],["Профессор Лютийн лекц маргааш үдээс хойш хэдэн цагт вэ?","Анх хоёр хагас цагт тогтоосон, түр зуур гурван цаг болгож өөрчилсөн гэж мэдэгдсэн.","Тэр лекцийн талаар аль нь зөв бэ?"],["Бидэнд үнэхээр аз таарлаа, далайн гадаргуу тайван, байгаль ямар сайхан бэ!","Тийм ээ, гарахын өмнө далайн өвчинд өртөх вий гэж санаа зовж байсан.","Эмэгтэйн талаар юу мэдэж болох вэ?"],["Өглөө босоход гэнэт толгой маш эргэж, бие тэнцвэрээ алдаад унасан.","Дараа нь яасан? Энэ өвчнийг сайн шалгах хэрэгтэй.","Эрэгтэй яагаад унасан бэ?"],["Багш чамайг зохиолоо дахин шалгахыг хэлсэн, дээр нь цэг таслалын алдаа байна.","За, би одоо харъя.","Багш зохиолд өөр ямар асуудал байна гэж үзсэн бэ?"],["Чи Лю Хун багшийг удирдагчаар сонгосон гэсэн үү?","Тийм, профессор Лю мэдлэгтэй, асуудлыг маш нарийн шинжилдэг ч жаахан нухацтай.","Эрэгтэй профессор Лю-г яаж үзэж байна вэ?"],["Таны сонгосон хоёр байр төстэй, зөвхөн талбайн зөрүү хорь гаруй мкв.","Байрны чанар ямар вэ?","Энэ нь бүрэн баталгаатай, би томыг нь авахыг зөвлөе, тухтай амьдарна.","Том нь сайн ч үнэ нь надад жаахан даах хэцүү.","Эмэгтэй эрэгтэйн санал болгосон байрыг яаж үзэж байна вэ?"],["Өчигдрийн салхи үнэхээр хүчтэй, салхи сөрж явахад хэцүү.","Бидний эсрэг талын байшингийн зар самбарыг салхи унагачихлаа.","Аймшигтай, хүн дээр унасангүй биз?","Аз болоход хүн байгаагүй, гэхдээ цагдаа, гал түймэр унтраах алба ирсэн.","Яриаг үндэслэн өчигдрийн салхины талаар юу мэдэж болох вэ?"],["Шалыг арчиж байтал зурагтын тавиурын доор чиний уруулын будаг оллоо.","Хаана алга болчихсон бол гэж бодсон, тэнд өнхөрчихсөн юм байна.","Дэргэд байгаа хайртай хүүгээсээ асуу, өчигдөр цэцэрлэгийн багш нар ээжийн зургийг зурахыг хэлсэн.","Аа, тийм байж, зураг дээрх уруулын будгийн өнгө яагаад миний уруулын будагтай ийм төстэй байсан юм бол.","Эмэгтэйн уруулын будгийг хаанаас олсон бэ?"],["Энэ лонх чи таглаад хаагаад ч хэн ч нээж чаддаггүй.","Би туслая.","Цаашид таглахдаа хэтэрхий хүч бүү хэрэглээрэй.","Би тийм их хүч хэрэглээгүй, лонхны амсарт зөгийн бал хүрсэн.","Лонхыг нээж чадахгүй байгаагийн шалтгааныг эмэгтэй юу гэж үзэж байна вэ?"],["Эрт цагт нэг цэрэг тулалдаанд хөлдөө сум тусч хүчтэй өвдөв. Командлагч гадаад мэс заслын эмч урьж эмчлүүлэв. Эмч харчихаад: «Энэ хэцүү биш!» гэж хайч гаргаж, гадна гарсан сумны ишийг тайрч, мэс заслын төлбөр авчихаад явах гэв. Цэрэг яаран: «Сумны ишийг тайрах бол хэн ч чадна! Би чамайг махан дотор орсон сумны үзүүрийг гаргаж өгөхийг хүсч байна!» гэв. Эмч толгой сэгсрээд: «Гадаад мэс заслын ажлыг би хийж дууссан, махан доторх сумны үзүүрийг ухах нь дотоод анагаахын ажил.» гэв.","Тэр цэргийн талаар юу мэдэж болох вэ?","Тэр эмчийн талаар аль нь зөв бэ?"],["Бүтээгдэхүүний борлуулалтын хурал дээр борлуулалтын байдал маш урам хугарам байсан тул менежер борлуулалт хариуцсан ажилтнуудыг чангаар зэмлэв: «Би та нарын муу ажлыг үзэж, шалтгаануудыг чинь сонсож цадлаа. Хэрэв та нар энэ ажлыг даах чадвар байхгүй бол та нарын оронд өөр хүн ирж энэ үнэтэй бүтээгдэхүүнийг зарна.» Дараа нь тэр шинээр авсан ажилтан, саяхан хөл бөмбөгийн багаас гарсан тоглогч руу эргэж: «Хэрэв нэг баг хожиж чадахгүй бол яах вэ? Тоглогчид бүгд солигдох ёстой биз?» гэв. Хэдэн секунд чимээгүй болсны дараа тэр хуучин хөл бөмбөгчин: «Үнэндээ эрхэм ээ, бүх баг асуудалтай бол бид ихэвчлэн шинэ дасгалжуулагч солино.» гэв.","Менежер борлуулалтын ажилтнуудын гүйцэтгэлийг яаж үзэж байна вэ?","Менежер хуучин хөл бөмбөгчнөөс яагаад асуусан бэ?"]],"x26":[["Шанхайн тэр бараа хэр бэлэн болсон бэ? Цаг алдахгүй байгаарай.","Санаа зовох хэрэггүй, Сяо Ли нар энэ хоёр өдөр илүү цагаар ажиллаж, гэрээнд заасан өдөр бараа илгээхийг баталгаажуулна.","Тэр барааны талаар юу мэдэж болох вэ?"],["Хөөе, чи одоо дотуур байранд байна уу?","Би дөнгөж хичээлээс гарсан, номын сан руу материал хайхаар явах гэж байна, ямар нэг хэрэг байна уу?","Эмэгтэй одоо юу хийхээр бэлдэж байна вэ?"],["Хэрэв чи хүүхдэдээ ердийн үедээ илүү санаа тавьсан бол тэр шалгалтанд тэнцэхгүй хэмжээнд хүрэхгүй байсан байх?","Яагаад үүнийг бүгдийг миний буруу гэж үзэж байна вэ? Чи ээж болохоор бас хариуцлагатай шүү дээ.","Тэдний ярианаас юу мэдэж болох вэ?"],["Эцэст нь болоод өгөв, үнэхээр ядарлаа.","Хурдан амар, ийм жижиг ширээ угсрах ийм төвөгтэй байх нь санаанд ороогүй.","Эрэгтэйн талаар юу мэдэж болох вэ?"],["Тавтай морил, манай дэлгүүрийн таван жилийн ойн баяр, бүх бараа 50 хувийн хөнгөлөлттэй.","Би хүүхдэдээ теннисний гутал авмаар байна, энэ загвар 42 размертай юу?","Яриаг үндэслэн юу мэдэж болох вэ?"],["Ван даргаа, энэ таны онгоцны тасалбар, хоёр талдаа.","Сайн, баярлалаа. Би энэ хоёр гэрээнд гарын үсэг зурсан, чи борлуулалтын хэлтсийн менежер Лю-д хүргэж өгөөрэй.","Яриаг үндэслэн юу мэдэж болох вэ?"],["Энэ номын тавиурыг би яагаад угсарч чадахгүй байна вэ?","Чи зааврын алхмын дагуу угсарсан уу?","Тийм, нэг эд ангийг хаана тавихыг ойлгохгүй байна, заавар тодорхой бичээгүй.","Тэгвэл худалдагч руу залгаж асуугаарай.","Эрэгтэй яагаад номын тавиурыг угсарч чадахгүй байна вэ?"],["Танай Сяо Сюэгийн гэрийн даалгавар хэдэн цаг хүртэл хийгддэг вэ?","Оройн хоолны өмнө дуусчихдаг. Одоо сургууль хэт их даалгавар өгөхийг зөвшөөрдөггүй.","Манай Сяо Мин өдөр бүр арван цаг хүртэл хийдэг.","Тийм биш, чи түүний анхаарал төвлөрөх чадварыг хөгжүүлж, үр ашгийг дээшлүүлэхэд анхаар.","Сяо Мин даалгавраа оройтож хийдэг шалтгааныг эмэгтэй юу гэж үзэж байна вэ?"],["Уучлаарай, танд ийм удаан цаг алдууллаа.","Зүгээр, Лян Лянгийн суралцахад эцэг эхийн анхаарал, хяналт ч салшгүй.","Маш их баярлалаа! Таныг зовоолоо.","Нээрээ хэрэггүй эелдэг, манай сургуулийн ажлыг дэмжиж хамтарч байгаад баярлалаа.","Эрэгтэй Лян Лянгийн хэн байх магадлалтай вэ?"],["Сүүлийн үед нүдэнд бүх юм бүдэг харагддаг, хөгшин хараа болсон уу?","Чи хэдэн настай хэрэг юм бэ, хөгшин хараа гэж!","Манай хамт ажиллагч дөнгөж 45 настай нүд нь муудсан.","Чи сүүлийн үед бичиг хийхдээ хэт орой болсон байна, компьютер бага хар л даа.","Эмэгтэй эрэгтэйн нүдийг ямар асуудалтай гэж үзэж байна вэ?"],["Нэгэн дарсны үйлдвэрлэгч удаан хугацааны хүчин чармайлтын үр дүнд өвөрмөц амттай усан үзмийн дарс бэлтгэж, «Чи Юй» гэж нэрлэв. Гэвч тэр сурталчилгаа хийх чадваргүй тул дарсны борлуулалт маш муу байв. Яаралтай байдлаас тэр нэг арга олов: өдөр бүр орой дарс зардаг дэлгүүр болгонд очиж Чи Юй усан үзмийн дарс авахыг хүсэв. Мэдээж «Байхгүй» гэсэн хариу авав. Тэгэхэд тэр халуун дотноор: «Зүгээр, та нар авчирсны дараа би дахин авах гэж ирье» гэв. Асуулт олширох тусам олон дэлгүүр энэ дарсанд анхаарч, хаанаас авч болохыг лавлаж эхэлсэн. Ингэж Чи Юй усан үзмийн дарсны зах зээл нээгдэв. Энэ түүх бидэнд нэг сургамж өгч байна: асуудлыг шийдэж чадахгүй үед идэвхтэй санаагаа өөрчилж, бусад өнцгөөс бодвол, нүдэнд гэрэл тусна.","Чи Юй дарс яагаад муу зарагдсан бэ?","Дарсны үйлдвэрлэгч ямар арга олсон бэ?"],["Өөрөө бизнесийн зовлонг туулсан хүн л хэмнэх учрыг мэднэ, бүтээх хүнд хэцүү, баялгийн амаргүй байдлыг мэднэ. Жон тийм хүн. Тэр маш баян ч өдөр тутмын зардалдаа маш хэмнэлттэй. Нэг өдөр тэр Нью-Йорк дахь нэг зочид буудалд орохдоо хамгийн хямд өрөө авахыг хүсэв. Зочид буудлын үйлчлэгч: «Ноён, та яагаад хямд жижиг өрөөнд буух гэж байна? Таны хүү ирэхдээ үргэлж хамгийн тансаг өрөөг сонгодог шүү дээ!» гэв. «Тийм ээ,» гэж Жон хэлэв, «миний хүүд сая сая долларын баян аав бий, гэхдээ надад байхгүй юм!»","Яриан дахь хоёр хүн ямар харилцаатай вэ?","Жоны талаар юу мэдэж болох вэ?"]],"x27":[["Шинэ компанид ороод чи сургамж авч, үлдэхийг хичээгээрэй.","Өмнөх боломжийг би нандигнаагүй, энэ удаа заавал сайн үзүүлнэ.","Эмэгтэйн талаар юу мэдэж болох вэ?"],["Энэ төслийн тамирчид нэг нь нэгээсээ хүчтэй, Лю Юнь финалд гарах нь үнэхээр амаргүй.","Энэ жил түүний байдал маш сайн, түвшнээсээ давж гүйцэтгэсэн гэж хэлж болно.","Эрэгтэй Лю Юньг яаж үзэж байна вэ?"],["Өвлийн амралтаар чи гэртээ харихгүй юу?","Би аялал жуулчлалын агентлагт дадлага хийж байна, компани надад шинэ маршрут зохиохыг даалгасан, шинэ жилийн өмнө томилолтоор судалгаа хийх хэрэгтэй.","Эмэгтэй өвлийн амралтаар яагаад гэртээ харихгүй байна вэ?"],["Сяо Лю аз сайтай юм, ирээд нэг жилийн дотор үндсэн тоглогч болчихлоо.","Чи ч сэтгэл бүү гутар, хүч чадлаараа чи түүнээс дутахгүй, дараа сарын тэмцээнд сайн боломжоо ашигла.","Эрэгтэй эмэгтэйд ийм үг хэлж яахыг хүсэж байна вэ?"],["Би Сяо Линд зарим үзэл бодолтой, үүнийг би үгүйсгэхгүй.","Чамайг боломж олж түүнтэй ярилцаж, асуудлыг нээлттэй ярьж, ажилд нөлөөлөхгүй байхыг хүсч байна.","Эмэгтэй Сяо Линтэй ямар харилцаатай байх магадлалтай вэ?"],["Чи мэдэхгүй юу? Тэмцээний үеэр ямар ч тамирчин дураараа гарч болохгүй.","Би дасгалжуулагчид урьдчилж хэлсэн, тэр зөвшөөрсөн.","Эрэгтэйн талаар юу мэдэж болох вэ?"],["Өчигдөр би хөрш Лили гэрт эд зүйл буцааж өгөхөд тэдний хөшиг надад их таалагдсан.","Яасан? Чи дахиад юу хийх гэж байна?","Манай зочны өрөөний хөшиг олон жил хэрэглэгдсэн, хээ нь моодноос гарсан.","Миний үзэхээр зүгээр л жаахан бохир болсон, угаавал хэрэглэж болно.","Хөшигний талаар эрэгтэй юу гэж бодож байна вэ?"],["Өмнө нь Ли Ян Герман руу зааж явахад удирдлага надаас ч асуусан.","Тэгээд чи яагаад явсангүй вэ?","Тэр үед хүүхэд жаахан байсан, би эргэлзсэн. Одоо жаахан харамсаж байна.","Сайхан боломж алдсан, миний туршлага бол боломж гарвал заавал сайн ашиглах.","Эрэгтэй яагаад Герман руу заахаар явсангүй вэ?"],["Лю Жин мэдээнд үнийг буруу бичсэн бололтой, чи яагаад шалгаж олоогүй вэ?","Үнэхээр! Өмнөх хурлаар тодорхой ярилцсан, тэр яагаад дахин алдаа гаргав.","Чи асуудал гарахад үргэлж бусдыг буруутгадаг, өөрөөсөө шалтгаан хайхыг бодохгүй.","Би голдуу түүнд хэт итгэсэн.","Энэ хэрэгт эмэгтэй эрэгтэйг яаж үзэж байна вэ?"],["Сяо Лю чөлөө аваад бөмбөгийн тоглолт үзсэн нь чиний зөвшөөрлөөр үү?","Тэр сүүлийн үед загварын төлөвлөгөөг засаж маш их зовсон, би түүнийг амраахыг хүссэн.","Ажил зовлонтой нь ойлгомжтой ч түүнтэй харилцаа сайн болохоор журмын дагуу хийхгүй байж болохгүй.","Би ойлголоо, дараагийн удаа дахиж дураараа шийдэхгүй.","Эмэгтэй эрэгтэйг юугаар шүүмжилж байна вэ?"],["Лю Мин биеийн тамирын заалнаас гарч ирсэн нэг найзтайгаа таарав. Тэр найзаасаа асуув: «Яаж тоглов?» «Маш сайн!» гэж найз хариулав, «Би теннис тоглож, шатар тоглосон. Шатрын аварга ч, теннисний аварга ч би хожсон.» «Чи теннис, шатар хоёулаа мундаг уу?» гэж Лю Мин асуув. «Би теннисний аваргатай шатар тоглоод хожсон, дараа нь шатрын аваргатай теннис тоглоод бас түүнийг хожсон.» Тэмцээнд өөрийгөө, өрсөлдөгчөө мэдэж, ашигтай өрсөлдөгч сонгох нь ялах сайн арга юм.","Лю Мингийн найзын талаар юу мэдэж болох вэ?","Энэ хэсэг бидэнд ямар сургамж өгч байна вэ?"],["14-ний өдрийн хөл бөмбөгийн тоглолтод Шанхайн баг гэрийн талбай дээрээ Бээжингийн багтай тулав. Тэр өдөр Шанхайд үдээс хойш үргэлж бороо орсон. Эхний хагаст талбайн нөхцөл боломжийн байсан бөгөөд эхнээс нь гэрийн баг тоглолтыг удирдаж, олон гоолын боломжийг үрсэн. Тэд 24-р минутад л эхний гоолоо оруулсан ч 4 минутын дараа зочин багийн ахлагч Бээжингийн багийн төлөө тэнцүүлэв. Хоёрдугаар хагаст талбайн зарим хэсэгт ус тогтсон нь тодорхой болж, хоёр талын ахлагч шүүгчид тоглолтыг үргэлжлүүлэхэд бэлэн гэж хэлсэн ч 20 минут өнгөрсний дараа талбайн нөхцөл маш муу болж, усан бөмбөгийн тэмцээн болох шахав. Шүүгч түр зогсоож, тоглогчид амрах өрөөнд буцав. 15 минутын дараа ерөнхий шүүгч талбайн ус улам ноцтой болсныг хараад тоглолтыг зогсоохоор шийдэв.","Эхний хагасын тоглолтоос юу мэдэж болох вэ?","Хоёрдугаар хагасын тоглолт бодитоор хэр удаан үргэлжилсэн бэ?"]],"x28":[["Сяо Лю, чи энэ жил төгсөх гэж байна, ажил хайх талаар ямар бодолтой байна?","Үнэнийг хэлэхэд, мэргэжлийн хувьд би өөрт ямар ч давуу тал байхгүй гэж бодож байна.","Эрэгтэй өөрийгөө яаж үзэж байна вэ?"],["Уучлаарай, би Бугуны гудамж руу явах гэсэн, яаж явах вэ?","Урд талаас 1-р автобусанд суугаад Тяньаньмэнь дорнод хүртэл, дараа нь 3-р автобусанд шилжинэ.","Эндээс Бугуны гудамж хүртэл хэдэн удаа автобус шилжих вэ?"],["Манай вэбсайтын редакторын албан тушаалд өргөдөл гаргахад та өөрт ямар давуу тал байна гэж бодож байна?","Миний мэргэжил компьютер, компьютерийн программыг маш чадварлаг хэрэглэдэг, түүнээс гадна би уран зохиолд маш дуртай.","Эрэгтэй өөрийгөө аль талаараа хамгийн хүчтэй гэж үзэж байна вэ?"],["Өчигдөр л сонслоо, чи Ван Линтэй ангийнх гэсэн. Тэр хүнтэй дотно уу?","Тийм ч дотно биш, нэг төгсөлтийн жилтэй ч өөр ангид, байшин дотор уулзвал мэндэлдэг л харилцаатай.","Эмэгтэй Ван Линтэй ямар харилцаатай вэ?"],["Энэ удаагийн тэмцээнд Сяо Лиг явуулбал яасан юм бэ? Хариу үйлдэл нь хурдан.","Сяо Ли хариу хурдан ч суурь чадвар нь Сяо Жангаас сайн биш.","Эрэгтэй хэнийг тэмцээнд явуулахыг хүсч байна вэ?"],["Та нарын өгдөг цалин хэтэрхий өндөр биш үү?","Мэргэжлийн, зөрүүд, шилдэг авьяастан үнэлж баршгүй.","Эмэгтэй юу гэсэн үг вэ?"],["Маргааш төслийн уулзалт болно, чи энэ удаа Сяо Лю хариуцахыг үнэхээр хүсч байна уу?","Бид аль хэдийн тохирсон биш билүү? Сяо Лю юугаараа муу вэ?","Тэр шинэ хүн шүү дээ.","Чи бусдад итгэл дутуу байдаг.","Эрэгтэй юу гэсэн үг вэ?"],["Энэ жил ажил хайж байгаа төгсөгчдөөс оффисын ажилд тохирох хүн байна уу?","Яасан? Сяо Гао сайн биш билүү?","Тэр ирэх сард ажлаасаа гарч, бусадтай хамт компани нээнэ гэсэн.","Би чамд харж өгье.","Сяо Гаогийн талаар аль нь зөв бэ?"],["Багш аа, миний диссертаци ямар байна?","Чиний диссертацийн энэ дүгнэлт хаанаас гарсан юм бэ? Би шинжлэх ухааны шинжийг огт харахгүй байна.","Та «Зоригтой таамаглал хий» гэж хэлээгүй юу?","«Зоригтой таамаглал»-ын ард «Болгоомжтой нотол» гэсэн бас нэг өгүүлбэр байгаа шүү!","Багш энэ диссертацийг яаж үзэж байна вэ?"],["Та нарт өнөөдөр юу болсон бэ? 8:30-д хичээл эхлэх ёстой, арав гаруй хүн л ирсэн, одоо 9:00 болчихлоо, гуравхан хүн ирээгүй байна.","Багш аа, тэд гурав өвдөж, эмнэлэг явсан, удахгүй ирнэ.","Удахгүй удахгүй, хагас цаг хоцорчихлоо!","Харна уу, тэд ирлээ!","Өнөөдөр сурагчид хичээлд ирсэн байдал ямар байна вэ?"],["Өмнө нь компани чамайг аваагүй, чи яагаад бидэнд талархлын захидал бичих гэж байна вэ?","Компани намайг аваагүй ч намайг анкетыг минь нухацтай үзэж, ярилцлагын туршлага өгсөн, талархал илэрхийлэх хэрэгтэй гэж бодсон.","Чи сайн хийжээ! Чиний бичсэн талархлын захидал чамайг маш эелдэг, манай компанид чин сэтгэлтэй хүн гэдгийг мэдрүүлж, тиймээс энэ удаагийн сонгон шалгаруулалтад бид чамайг түрүүлж авч үзсэн.","Та болон компанид надад энэ боломжийг өгсөнд маш их баярлалаа.","Энэ боломжийг чи өөрөө бүтээсэн.","Ярьж буй хоёр хүн ямар харилцаатай вэ?","Энэ удаагийн ажилд авалтад компани яагаад энэ эрэгтэйг түрүүлж авч үзсэн бэ?"],["Найдвар олон улсын зочид буудал бол энэ хотын цорын ганц таван одтой зочид буудал, 5.5 мянган мкв талбайтай, нийт 288 өрөөтэй. Одоо зочид буудлын санхүүгийн хэлтэс санхүүгийн менежер нэг, өртгийн ахлагч нэг, мэдээллийн технологийн ахлагч нэг хүн авна. Дээрх албан тушаалууд бүгд холбогдох мэргэжлийн магистрын зэрэгтэй, зочид буудалд хоёр жилээс дээш ажилласан туршлагатай байх ёстой. Зочид буудал байр өгнө, цалинг ярилцан тохирно. Бид танд зохицсон ажлын орчин, сайн суралцах уур амьсгал бүрдүүлж, таван одтой зочид буудлын удирдлагын ур чадвар заан, хурдан өсөхөд тусална.","Зочид буудал ажилд орогсдоос ямар шаардлага тавьдаг вэ?","Зочид буудлын талаар аль нь зөв бэ?"]],"x29":[["Сургуулийн дотор хэд хэдэн жижиг супермаркет байна, та нар яагаад бүгд тэр дэлгүүрт явах дуртай вэ?","Тэр дэлгүүрийн үйлчилгээ сайн, бараа бүрэн, үнэ үндэслэлтэй.","Тэр супермаркетын давуу тал аль нь вэ?"],["Тэр хоёр дэлгүүрийн бизнес муу байна, чи яагаад тэднийг дарж унагаачихгүй юм бэ?","Би бусад хоёр дэлгүүрийг унагавал сайн хэрэг биш гэж үзэж байна, учир нь бусад хүн ийм том газар зөвхөн нэг л дэлгүүр байгааг хараад шинэ дэлгүүр гарч ирж магадгүй.","Эмэгтэй яагаад өрсөлдөгчөө унагаахгүй байна вэ?"],["Яаж энэ хүүхдүүдийг сайн сургахаа үнэхээр мэдэхгүй байна!","Чи эхлээд тэдэнтэй сэтгэл холбоо тогтоож, дараа нь төгөлдөр хуурын сонирхлыг нь хөгжүүл.","Эрэгтэй юу гэсэн үг вэ?"],["Би энэ байрыг сайн гэж бодож байна, хэмжээ тохиромжтой, үнэ хямд, доор нь жижиг дэлгүүр ч бий, юм авахад тохиромжтой.","Тийм, байрны эзэн ч сэтгэлтэй харагдаж байна.","Тэд юуны тухай ярьж байна вэ?"],["Энэ бүтээгдэхүүн сайн, зөвхөн үнэ нь жаахан өндөр.","Бидний чанарт маргах зүйлгүй. Та хэчнээн авах вэ? Их хэмжээгээр бол 20 хувийн хөнгөлөлт өгч болно.","Эрэгтэй юу гэсэн үг вэ?"],["Гэрээнд төлбөрийн хэлбэрийг яаж тохирсон бэ?","Бараа ирсний дараа банкны шилжүүлгээр төлж, нөгөө тал гурван өдрийн дотор нэхэмжлэх гаргана.","Хоёр тал төлбөрийг хэрхэн төлөхөөр тохирсон бэ?"],["Өнөөдөр ажилдаа ирэхэд үнэхээр ядарлаа!","Нар баруунаас гарлаа, чи хэзээ ч биеийн тамирын дасгал хийдэггүй байсан биз дээ?","Яалтай, зам их түгжирсэн, метро ч шахцалдсан.","Чи ч бас хөдлөх цаг боллоо.","Эмэгтэй өнөөдөр ямар аргаар ирсэн байх магадлалтай вэ?"],["Ээж ээ, би
